name: HLG-M4 Job 4 A/B integration

on:
  pull_request:
    branches: [research/hlg-m4-preimplementation-ledger]
    paths:
      - "src/rgm/leptograph/m4/**"
      - "src/rgm/experiments/hlg_m4_job4.py"
      - "tests/test_hlg_m4_ab_integration.py"
      - ".github/workflows/hlg-m4-job4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab-integration:
    name: A/B integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run A/B and P0 integration tests
        run: python -m pytest tests/test_hlg_m4_ab_integration.py tests/test_hlg_m4_p0_p1.py
      - name: Execute 20-seed A/B integration smoke experiment
        run: |
          mkdir -p "$RUNNER_TEMP/m4-job4"
          python -m rgm.experiments.hlg_m4_job4 "$RUNNER_TEMP/m4-job4/results.json"
          printf "commit=%s\npython=%s\n" "$GITHUB_SHA" "${{ matrix.python-version }}" > "$RUNNER_TEMP/m4-job4/manifest.txt"
          sha256sum "$RUNNER_TEMP/m4-job4/results.json" > "$RUNNER_TEMP/m4-job4/results.sha256"
      - name: Upload Job 4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m4-job4-ab-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/m4-job4/
          if-no-files-found: error
