name: bAbI expansion runtime and prediction-contract acceptance

on:
  push:
    branches:
      - "research/babi-runtime-prediction-contract-v1"
      - "research/babi-expansion-campaign-freeze-v1"
      - "research/babi-task-expansion-v1"
    paths:
      - "src/rgm/experiments/babi_expansion_runtime.py"
      - "tests/test_babi_expansion_runtime.py"
      - "tests/test_babi_expansion_campaign_protocol.py"
      - "src/rgm/experiments/babi_expansion_adapters.py"
      - "src/rgm/leptograph/m4/**"
      - "tests/test_hlg_integrated_contract_acceptance.py"
      - "tests/test_hlg_learning_runtime_integration.py"
      - "tests/test_babi_task_expansion.py"
      - ".github/workflows/h1-babi-expansion-runtime-acceptance.yml"
  pull_request:
    paths:
      - "src/rgm/experiments/babi_expansion_runtime.py"
      - "tests/test_babi_expansion_campaign_protocol.py"
      - "tests/test_babi_expansion_runtime.py"
      - "src/rgm/experiments/babi_expansion_adapters.py"
      - "src/rgm/leptograph/m4/**"
      - "tests/test_hlg_integrated_contract_acceptance.py"
      - "tests/test_hlg_learning_runtime_integration.py"
      - "tests/test_babi_task_expansion.py"
      - ".github/workflows/h1-babi-expansion-runtime-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: babi-expansion-runtime-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Expansion adapter and runtime contract tests
        run: |
          pytest -q tests/test_babi_expansion_adapters.py tests/test_babi_expansion_runtime.py tests/test_babi_expansion_campaign_protocol.py
      - name: Integrated HLG evidence and prediction lifecycle
        run: |
          pytest -q tests/test_hlg_integrated_contract_acceptance.py tests/test_hlg_learning_runtime_integration.py tests/test_hlg_learning_mechanisms.py tests/test_hlg_learning_episode_boundary.py
      - name: Frozen Task 3/5 regression protection
        run: |
          pytest -q tests/test_babi_learning_campaign.py tests/test_babi_structured.py tests/test_babi_annotation.py
