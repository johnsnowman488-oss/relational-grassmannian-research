name: bAbI source candidate inspection

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/h0-shared-hierarchy-contract-soe-bridge"]
    paths:
      - "scripts/freeze_babi_tasks.py"
      - ".github/workflows/babi-source-inspection.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect first available bAbI archive without accepting it
        run: python scripts/freeze_babi_tasks.py --inspect-candidates
