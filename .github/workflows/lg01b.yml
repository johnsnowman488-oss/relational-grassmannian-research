name: LG-01B hidden-topology recovery

on:
  push:
    branches: ["research/lg01b-implementation"]
    paths:
      - "src/rgm/experiments/lg01b.py"
      - "tests/test_lg01b.py"
      - "docs/lg01b_protocol.md"
      - "docs/lg01b_ledger.md"
      - ".github/workflows/lg01b.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/rgm/experiments/lg01b.py"
      - "tests/test_lg01b.py"
      - "docs/lg01b_protocol.md"
      - "docs/lg01b_ledger.md"
      - ".github/workflows/lg01b.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Full test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full mathematical, invariant, and reproducibility suite
        run: python -m pytest -q

  campaign:
    name: Frozen LG-01B 30-world paired-rate campaign
    if: github.event_name == 'push'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Execute frozen LG-01B-v0.1 campaign
        id: run
        env:
          LG01B_RUN_ID: lg01b_${{ github.run_id }}_${{ github.run_attempt }}
        shell: bash
        run: |
          set +e
          python -m rgm.experiments.lg01b --run-id "$LG01B_RUN_ID" --output-root results/lg01b
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "run_id=$LG01B_RUN_ID" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete LG-01B evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lg01b-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/lg01b/${{ steps.run.outputs.run_id }}/
          if-no-files-found: error
          retention-days: 90
      - name: Propagate scientific gate result after evidence upload
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.run.outputs.exit_code }}" != "0" ]]; then
            echo "LG-01B executed and evidence was preserved, but its pre-registered scientific gate failed."
            exit 1
          fi
          echo "LG-01B pre-registered scientific gates passed at both rates."
