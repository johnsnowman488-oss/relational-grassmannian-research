name: HLG-H0 hierarchy contract and SOE bridge

on:
  pull_request:
    branches: [research/hlg-m4-preimplementation-ledger]
    paths:
      - "src/rgm/leptograph/m4/**"
      - "tests/test_hlg_m4_soe_bridge.py"
      - "docs/experiments/HLG_H0_SHARED_HIERARCHY_CONTRACT.*"
      - ".github/workflows/hlg-h0-bridge.yml"

permissions:
  contents: read

jobs:
  h0-tests:
    name: H0 contract and regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run complete unit and invariant suite
        run: python -m pytest
