name: HLG-M4 independent-world preflight and validation pilot

on:
  pull_request:
    branches: [research/hlg-m4-preimplementation-ledger]
    paths:
      - "src/rgm/experiments/m4_confirmatory_worlds.py"
      - "tests/test_hlg_m4_confirmatory_worlds.py"\n      - "src/rgm/experiments/m4_confirmatory_pilot.py"\n      - "tests/test_hlg_m4_confirmatory_pilot.py"
      - ".github/workflows/hlg-m4-confirmatory-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-preflight:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test generator invariants
        run: python -m pytest tests/test_hlg_m4_confirmatory_worlds.py
      - name: Emit generator-only preflight manifest
        run: |
          mkdir -p "$RUNNER_TEMP/m4-confirmatory-preflight"
          export M4_PREFLIGHT_OUT="$RUNNER_TEMP/m4-confirmatory-preflight/preflight.json"
          python - <<'PY'
          import json
          import os
          from rgm.experiments.m4_confirmatory_worlds import (
              default_partitions, partition_manifest, preflight_audit
          )
          payload = {
              "audit": preflight_audit(96),
              "partitions": partition_manifest(default_partitions()),
              "notice": "No confirmatory model-performance outcomes are generated by this workflow."
          }
          with open(os.environ["M4_PREFLIGHT_OUT"], "w") as f:
              json.dump(payload, f, indent=2, sort_keys=True)
          PY
          sha256sum "$RUNNER_TEMP/m4-confirmatory-preflight/preflight.json" > "$RUNNER_TEMP/m4-confirmatory-preflight/preflight.sha256"\n          python -m rgm.experiments.m4_confirmatory_pilot "$RUNNER_TEMP/m4-confirmatory-preflight/validation-pilot.json"\n          sha256sum "$RUNNER_TEMP/m4-confirmatory-preflight/validation-pilot.json" > "$RUNNER_TEMP/m4-confirmatory-preflight/validation-pilot.sha256"
      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m4-world-preflight-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/m4-confirmatory-preflight/
          if-no-files-found: error
