name: HLG-M4 confirmatory A/B campaign

on:
  push:
    branches: [m4/confirmatory-worlds-preflight]
    paths:
      - "docs/experiments/HLG_M4_CONFIRMATORY_CONFIG.json"
      - "docs/experiments/HLG_M4_CONFIRMATORY_CONFIG.sha256"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'M4: freeze protocol and authorize confirmatory test run')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify protocol seal, implementation parent and guard tests
        shell: bash
        run: |
          set -euo pipefail
          IMPLEMENTATION_COMMIT="$(git rev-parse HEAD^)"
          EXPECTED_CONFIG_SHA="$(cat docs/experiments/HLG_M4_CONFIRMATORY_CONFIG.sha256)"
          ACTUAL_CONFIG_SHA="$(sha256sum docs/experiments/HLG_M4_CONFIRMATORY_CONFIG.json | awk '{print $1}')"
          test "$EXPECTED_CONFIG_SHA" = "$ACTUAL_CONFIG_SHA"
          CONFIG_PARENT="$(python -c 'import json; print(json.load(open("docs/experiments/HLG_M4_CONFIRMATORY_CONFIG.json"))["parent_implementation_commit"])')"
          test "$IMPLEMENTATION_COMMIT" = "$CONFIG_PARENT"
          echo "M4_EXPECTED_CONFIG_SHA256=$EXPECTED_CONFIG_SHA" >> "$GITHUB_ENV"
          echo "M4_IMPLEMENTATION_COMMIT=$IMPLEMENTATION_COMMIT" >> "$GITHUB_ENV"
          python -m pytest tests/test_hlg_m4_confirmatory_campaign.py tests/test_hlg_m4_confirmatory_frontier.py
      - name: Run frozen confirmatory campaign
        run: |
          mkdir -p "$RUNNER_TEMP/m4-confirmatory"
          python -m rgm.experiments.m4_confirmatory_campaign "$RUNNER_TEMP/m4-confirmatory/confirmatory-results.json"
          sha256sum "$RUNNER_TEMP/m4-confirmatory/confirmatory-results.json" > "$RUNNER_TEMP/m4-confirmatory/confirmatory-results.sha256"
      - name: Upload confirmatory evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m4-confirmatory-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/m4-confirmatory/
          if-no-files-found: error
