name: bAbI Tasks 11, 14 and 19 controlled execution preflight

on:
  push:
    branches:
      - "research/babi-expansion-preflight-v1"
    paths:
      - "src/rgm/experiments/babi_expansion_*.py"
      - "scripts/freeze_babi_expansion_sources.py"
      - "scripts/audit_babi_expansion.py"
      - "scripts/generate_babi_expansion_confirmatory.py"
      - "scripts/run_babi_expansion_native_preflight.py"
      - "scripts/run_babi_expansion_learning_microbenchmark.py"
      - "scripts/aggregate_babi_expansion_learning_microbenchmark.py"
      - "tests/test_babi_expansion_*.py"
      - "docs/experiments/HLG_BABI_EXPANSION_*.json"
      - "docs/experiments/HLG_BABI_EXPANSION_*.md"
      - ".github/workflows/h1-babi-expansion-preflight.yml"
  pull_request:
    branches:
      - "research/babi-task-expansion-v1"
    paths:
      - "src/rgm/experiments/babi_expansion_*.py"
      - "scripts/freeze_babi_expansion_sources.py"
      - "scripts/audit_babi_expansion.py"
      - "scripts/generate_babi_expansion_confirmatory.py"
      - "scripts/run_babi_expansion_native_preflight.py"
      - "scripts/run_babi_expansion_learning_microbenchmark.py"
      - "scripts/aggregate_babi_expansion_learning_microbenchmark.py"
      - "tests/test_babi_expansion_*.py"
      - "docs/experiments/HLG_BABI_EXPANSION_*.json"
      - "docs/experiments/HLG_BABI_EXPANSION_*.md"
      - ".github/workflows/h1-babi-expansion-preflight.yml"
  workflow_dispatch:
    inputs:
      enable_learning_cost_microbenchmark:
        description: "Explicitly authorize the bounded learning-enabled HLA/HLB resource microbenchmark"
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: babi-expansion-preflight-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # One-time containment for run 46071085170, whose original workflow
  # accidentally attached a learning-enabled job to the automatic PR path.
  cancel-unapproved-learning-microbenchmark:
    name: Cancel inadvertently auto-started learning-cost run
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel incident run unless it has already completed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=46071085170
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .status)"
          if [[ "${STATUS}" == "queued" || "${STATUS}" == "in_progress" ]]; then
            gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel"
            echo "Requested cancellation of unapproved learning-cost run ${RUN_ID}."
          else
            echo "Incident run ${RUN_ID} already has status ${STATUS}; no cancellation needed."
          fi

  contract-tests:
    name: Full repository tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run complete unit and invariant suite
        run: python -m pytest -q

  prepare-preflight:
    name: Freeze sources, partitions, baselines and confirmatory inputs
    needs: [contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Acquire and verify pinned Tasks 11, 14 and 19 source members
        run: python scripts/freeze_babi_expansion_sources.py --output data/babi-v1.2-expansion
      - name: Audit raw inputs, support witnesses and sealed official test
        run: |
          python scripts/audit_babi_expansion.py \
            --source-root data/babi-v1.2-expansion \
            --output-root artifacts/babi-expansion \
            --max-quarantine-fraction 0.005
      - name: Generate frozen label-separated confirmatory challenge
        run: |
          python scripts/generate_babi_expansion_confirmatory.py \
            --output-root artifacts/babi-expansion-confirmatory
      - name: Verify confirmatory hashes, query parity and evaluator separation
        run: |
          python scripts/generate_babi_expansion_confirmatory.py \
            --output-root artifacts/babi-expansion-confirmatory --verify
      - name: Build nested whole-story partitions, baseline validation and 360-unit manifest
        run: |
          python -m rgm.experiments.babi_expansion_preflight \
            --source-root data/babi-v1.2-expansion \
            --output-root artifacts/babi-expansion-preflight \
            --protocol docs/experiments/HLG_BABI_EXPANSION_LEARNING_CAMPAIGN_v1_0.json \
            --confirmatory-protocol docs/experiments/HLG_BABI_EXPANSION_CONFIRMATORY_v1_1.json \
            --confirmatory-root artifacts/babi-expansion-confirmatory \
            --prepare
      - name: Upload immutable source, partition, baseline and confirmatory inputs
        uses: actions/upload-artifact@v4
        with:
          name: babi-expansion-preflight-inputs
          path: |
            data/babi-v1.2-expansion/
            artifacts/babi-expansion/
            artifacts/babi-expansion-preflight/
            artifacts/babi-expansion-confirmatory/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  build-native:
    name: Build pinned Aberconics hierarchy runtime
    needs: [contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Aberconics C++ source and Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: vendor/aberconics-framework
      - name: Verify pinned source commit
        working-directory: vendor/aberconics-framework
        run: test "$(git rev-parse HEAD)" = "2539df6bda7ef3c9dd7c707abe26eff8bdbb59de"
      - name: Configure and build native shared library
        run: |
          cmake -S "vendor/aberconics-framework/code/c++ core" -B "vendor/aberconics-framework/code/c++ core/build-shared" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGFE_BUILD_TESTS=OFF -DGFE_BUILD_APPS=OFF
          cmake --build "vendor/aberconics-framework/code/c++ core/build-shared" --parallel 2
      - name: Verify and upload pinned native library
        run: |
          mkdir -p native
          cp "vendor/aberconics-framework/code/c++ core/build-shared/libgfe_core.so" native/libgfe_core.so
          test -s native/libgfe_core.so
          sha256sum native/libgfe_core.so | tee native/libgfe_core.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: babi-expansion-pinned-native-runtime
          path: native/
          if-no-files-found: error
          retention-days: 30

  four-worker-preflight:
    name: Shard ${{ matrix.shard }} non-learning dry run and retry acceptance
    needs: [prepare-preflight, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Aberconics Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: vendor/aberconics-framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download the exact frozen preflight inputs
        uses: actions/download-artifact@v4
        with:
          name: babi-expansion-preflight-inputs
          path: .
      - name: Download pinned native runtime
        uses: actions/download-artifact@v4
        with:
          name: babi-expansion-pinned-native-runtime
          path: native
      - name: Verify native runtime and source ABI pin
        run: |
          test -s native/libgfe_core.so
          sha256sum -c native/libgfe_core.sha256
          test "$(git -C vendor/aberconics-framework rev-parse HEAD)" = "2539df6bda7ef3c9dd7c707abe26eff8bdbb59de"
      - name: Create shard evidence directory before any execution
        run: mkdir -p artifacts/shards/shard-${{ matrix.shard }}
      - name: Measure actual pinned native HLA/HLB runtime with learning disabled
        env:
          GFE_CORE_LIB: ${{ github.workspace }}/native/libgfe_core.so
          GFE_ABERCONICS_COMMIT: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/vendor/aberconics-framework/code/python
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_babi_expansion_native_preflight.py \
            --source-root data/babi-v1.2-expansion \
            --output-root artifacts/shards/shard-${{ matrix.shard }}/native \
            --shard ${{ matrix.shard }} \
            --python-abi-path vendor/aberconics-framework/code/python
          python - "artifacts/shards/shard-${{ matrix.shard }}/native/native-runtime-usage.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["status"] == "PASS"
          assert report["story_count"] == 48
          assert report["native_step_count"] == report["event_count"] > 0
          assert report["learning_updates"] == 0
          assert report["labels_loaded"] == 0
          assert len(report["story_runs"]) == 48
          assert all(row["learner_parameters_unchanged"] for row in report["story_runs"])
          assert all(row["learning_updates"] == row["labels_loaded"] == 0 for row in report["story_runs"])
          PY
      - name: Exercise a mid-shard failure, preserve completed units, then retry
        shell: bash
        run: |
          set -euo pipefail
          PLAN="artifacts/babi-expansion-preflight/preflight-plan.json"
          OUT="artifacts/shards/shard-${{ matrix.shard }}"
          FAIL_KEY="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); m=json.load(open("artifacts/babi-expansion-preflight/"+p["manifest_path"])); rows=[r for r in m["run_units"] if r["shard"]==int(sys.argv[2])]; print(rows[45]["run_unit_key"])' "$PLAN" "${{ matrix.shard }}")"
          set +e
          python -m rgm.experiments.babi_expansion_preflight \
            --plan "$PLAN" --shard ${{ matrix.shard }} --shard-output "$OUT" \
            --inject-failure-key "$FAIL_KEY"
          FIRST_RC=$?
          set -e
          test "$FIRST_RC" -ne 0
          python - "$OUT" "$FAIL_KEY" <<'PY'
          import json, pathlib, sys
          root, key = pathlib.Path(sys.argv[1]), sys.argv[2]
          diagnostic = json.loads((root / "failure-diagnostic.json").read_text())
          assert diagnostic["error"].startswith("injected one-time failure for retry acceptance:")
          assert diagnostic["error"].endswith(key)
          assert len(diagnostic["completed_unit_keys"]) == 45
          assert (root / "partial-resource-usage.json").is_file()
          PY
          python -m rgm.experiments.babi_expansion_preflight \
            --plan "$PLAN" --shard ${{ matrix.shard }} --shard-output "$OUT"
          python - "$OUT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          status = json.loads((root / "shard-status.json").read_text())
          usage = json.loads((root / "resource-usage.json").read_text())
          assert status["status"] == "success"
          assert status["unit_count"] == 90
          assert len(status["skipped_unit_keys"]) == 45
          assert status["recovered_failure_diagnostic"] == "failure-diagnostic.json"
          assert usage["query_presentations"] == 900_000
          assert usage["learning_updates"] == 0
          assert usage["official_test_queries"] == 0
          assert usage["retry_elapsed_seconds_included"] > 0
          PY
      - name: Upload shard evidence even when execution fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-expansion-preflight-shard-${{ matrix.shard }}
          path: artifacts/shards/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

  aggregate-preflight:
    name: Verify all four shards and publish measured preflight gate
    needs: [prepare-preflight, four-worker-preflight]
    if: always() && needs.prepare-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -e ".[dev]"
      - name: Download the frozen manifest and inputs
        uses: actions/download-artifact@v4
        with:
          name: babi-expansion-preflight-inputs
          path: .
      - name: Download all four shard evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: babi-expansion-preflight-shard-*
          path: artifacts/shard-downloads
      - name: Require exact 360-key coverage, retries, metrics and resource evidence
        run: |
          python -m rgm.experiments.babi_expansion_preflight \
            --plan artifacts/babi-expansion-preflight/preflight-plan.json \
            --aggregate \
            --shard-dirs \
              artifacts/shard-downloads/babi-expansion-preflight-shard-0 \
              artifacts/shard-downloads/babi-expansion-preflight-shard-1 \
              artifacts/shard-downloads/babi-expansion-preflight-shard-2 \
              artifacts/shard-downloads/babi-expansion-preflight-shard-3 \
            --aggregate-output artifacts/babi-expansion-preflight/preflight-aggregate.json
      - name: Upload complete preflight acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-expansion-preflight-acceptance
          path: |
            artifacts/babi-expansion-preflight/
            artifacts/babi-expansion-confirmatory/
            artifacts/shard-downloads/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 365


  bounded-learning-cost-microbenchmark:
    name: Shard ${{ matrix.shard }} bounded learning-cost microbenchmark
    needs: [aggregate-preflight]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.enable_learning_cost_microbenchmark == true &&
      needs.aggregate-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Aberconics Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: vendor/aberconics-framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download the accepted frozen preflight input bundle
        uses: actions/download-artifact@v4
        with:
          name: babi-expansion-preflight-inputs
          path: .
      - name: Download pinned native runtime
        uses: actions/download-artifact@v4
        with:
          name: babi-expansion-pinned-native-runtime
          path: native
      - name: Verify native runtime and source ABI pin
        run: |
          test -s native/libgfe_core.so
          sha256sum -c native/libgfe_core.sha256
          test "$(git -C vendor/aberconics-framework rev-parse HEAD)" = "2539df6bda7ef3c9dd7c707abe26eff8bdbb59de"
      - name: Run bounded learning-enabled HLA/HLB fit-story sample
        env:
          GFE_CORE_LIB: ${{ github.workspace }}/native/libgfe_core.so
          GFE_ABERCONICS_COMMIT: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/vendor/aberconics-framework/code/python
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_babi_expansion_learning_microbenchmark.py \
            --source-root data/babi-v1.2-expansion \
            --output-root artifacts/learning-cost/shard-${{ matrix.shard }} \
            --shard ${{ matrix.shard }} \
            --python-abi-path vendor/aberconics-framework/code/python \
            --plan artifacts/babi-expansion-preflight/preflight-plan.json
          python - "artifacts/learning-cost/shard-${{ matrix.shard }}/learning-cost-microbenchmark-shard-${{ matrix.shard }}.json" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["status"] == "PASS"
          assert report["learning_enabled"] is True
          assert report["story_count"] == 48
          assert report["native_step_count"] == report["event_count"] > 0
          assert report["parameter_changed_story_runs"] == 48
          assert report["labels_loaded"] == 0
          assert report["official_test_queries"] == 0
          assert report["confirmatory_labels_loaded"] == 0
          assert report["learning_updates_enabled"] is True
          PY
      - name: Upload learning microbenchmark evidence even when execution fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-expansion-learning-cost-shard-${{ matrix.shard }}
          path: artifacts/learning-cost/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

  aggregate-learning-cost-microbenchmark:
    name: Aggregate bounded learning-cost microbenchmark
    needs: [bounded-learning-cost-microbenchmark]
    if: always() && needs.bounded-learning-cost-microbenchmark.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -e ".[dev]"
      - name: Download frozen preflight inputs and plan
        uses: actions/download-artifact@v4
        with:
          name: babi-expansion-preflight-inputs
          path: .
      - name: Download all four learning-cost shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: babi-expansion-learning-cost-shard-*
          path: artifacts/learning-cost-shard-downloads
      - name: Verify 192 story runs and aggregate measured update costs
        run: |
          python scripts/aggregate_babi_expansion_learning_microbenchmark.py \
            --plan artifacts/babi-expansion-preflight/preflight-plan.json \
            --shard-dirs \
              artifacts/learning-cost-shard-downloads/babi-expansion-learning-cost-shard-0 \
              artifacts/learning-cost-shard-downloads/babi-expansion-learning-cost-shard-1 \
              artifacts/learning-cost-shard-downloads/babi-expansion-learning-cost-shard-2 \
              artifacts/learning-cost-shard-downloads/babi-expansion-learning-cost-shard-3 \
            --output artifacts/learning-cost/learning-cost-aggregate.json
      - name: Upload learning-cost acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-expansion-learning-cost-acceptance
          path: artifacts/learning-cost/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 365
