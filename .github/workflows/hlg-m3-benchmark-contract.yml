name: HLG-M3 BM-0/BM-1 Benchmark Contract Gate

on:
  push:
    branches: [research/hlg-m3-benchmark-bm0-bm1]
    paths:
      - "docs/hybrid_leptograph_m3_benchmark_protocol_bm0_bm1_v0_1.md"
      - "docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json"
      - "docs/hybrid_leptograph_m3_benchmark_generator_contract_v0_1.md"
      - "src/rgm/experiments/hlg_m3_benchmark_contract.py"
      - "tests/test_hlg_m3_benchmark_contract.py"
      - ".github/workflows/hlg-m3-benchmark-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/hybrid_leptograph_m3_benchmark_protocol_bm0_bm1_v0_1.md"
      - "docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json"
      - "docs/hybrid_leptograph_m3_benchmark_generator_contract_v0_1.md"
      - "src/rgm/experiments/hlg_m3_benchmark_contract.py"
      - "tests/test_hlg_m3_benchmark_contract.py"
      - ".github/workflows/hlg-m3-benchmark-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-contract:
    name: BM-0/BM-1 manifest and boundary contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run BM-0/BM-1 contract tests
        run: python -m pytest tests/test_hlg_m3_benchmark_contract.py
      - name: Validate canonical split manifest
        run: >-
          python -m rgm.experiments.hlg_m3_benchmark_contract
          --manifest docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json
          --output results/hlg_m3_benchmark_bm0_bm1/manifest_validation.json
      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-bm0-bm1-contract-evidence
          path: results/hlg_m3_benchmark_bm0_bm1/manifest_validation.json
          if-no-files-found: error

  full-tests:
    name: Full repository tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full repository tests
        run: python -m pytest

  aggregate:
    name: Aggregate BM-0/BM-1 contract evidence
    runs-on: ubuntu-latest
    needs: [benchmark-contract, full-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download BM-0/BM-1 contract artifact
        uses: actions/download-artifact@v4
        with:
          name: hlg-m3-bm0-bm1-contract-evidence
          path: results/hlg_m3_benchmark_bm0_bm1
      - name: Verify contract evidence and preserve claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("results/hlg_m3_benchmark_bm0_bm1")
          expected = {"manifest_validation.json"}
          actual = {p.name for p in root.iterdir() if p.is_file()}
          assert actual == expected, {"expected": sorted(expected), "actual": sorted(actual)}
          evidence = json.loads((root / "manifest_validation.json").read_text())
          validation = evidence["validation"]
          assert evidence["campaign_id"] == "HLG-M3-BROAD-BENCHMARK-BM0-BM1-v0.1"
          assert validation["valid"] is True
          assert validation["world_configuration_count"] == 40
          assert validation["replicate_stream_count"] == 200
          assert validation["primary_test_compositions"] == 8
          assert validation["all_primary_test_atoms_seen_in_fit"] is True
          assert validation["primitive_ood_separately_excluded"] is True
          assert validation["m3_protocol_frozen"] is False
          assert validation["m3_scientific_validation_complete"] is False
          summary = {
              "campaign_id": evidence["campaign_id"],
              "manifest_sha256": evidence["manifest_sha256"],
              "contract_execution_passed": True,
              "world_configuration_count": validation["world_configuration_count"],
              "replicate_stream_count": validation["replicate_stream_count"],
              "primary_test_compositions": validation["primary_test_compositions"],
              "scientific_benchmark_executed": False,
              "m3_protocol_frozen": False,
              "m3_scientific_validation_complete": False,
              "claim_ceiling": evidence["claim_ceiling"],
              "decision": "BM0_BM1_CONTRACT_CHECKED_BM2_GENERATOR_IMPLEMENTATION_REMAINS_OPEN"
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-bm0-bm1-aggregate
          path: results/hlg_m3_benchmark_bm0_bm1/summary.json
          if-no-files-found: error
