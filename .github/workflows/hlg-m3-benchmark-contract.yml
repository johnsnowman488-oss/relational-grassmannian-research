name: HLG-M3 BM-0/BM-1 Benchmark Contract Gate

on:
  push:
    branches: [research/hlg-m3-benchmark-bm0-bm1]
    paths:
      - "docs/hybrid_leptograph_m3_benchmark_protocol_bm0_bm1_v0_1.md"
      - "docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json"
      - "docs/hybrid_leptograph_m3_benchmark_generator_contract_v0_1.md"
      - "src/rgm/experiments/hlg_m3_benchmark_contract.py"
      - "src/rgm/experiments/hlg_m3_benchmark_generator.py"
      - "tests/test_hlg_m3_benchmark_contract.py"
      - "tests/test_hlg_m3_benchmark_generator.py"
      - ".github/workflows/hlg-m3-benchmark-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/hybrid_leptograph_m3_benchmark_protocol_bm0_bm1_v0_1.md"
      - "docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json"
      - "docs/hybrid_leptograph_m3_benchmark_generator_contract_v0_1.md"
      - "src/rgm/experiments/hlg_m3_benchmark_contract.py"
      - "tests/test_hlg_m3_benchmark_contract.py"
      - ".github/workflows/hlg-m3-benchmark-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-contract:
    name: BM-0/BM-1 manifest and boundary contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run BM-0/BM-1 contract tests
        run: python -m pytest tests/test_hlg_m3_benchmark_contract.py
      - name: Validate canonical split manifest
        run: >-
          python -m rgm.experiments.hlg_m3_benchmark_contract
          --manifest docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json
          --output results/hlg_m3_benchmark_bm0_bm1/manifest_validation.json
      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-bm0-bm1-contract-evidence
          path: results/hlg_m3_benchmark_bm0_bm1/manifest_validation.json
          if-no-files-found: error

  bm2-generator:
    name: BM-2 F6-derived generator pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run BM-2 generator tests
        run: python -m pytest tests/test_hlg_m3_benchmark_generator.py
      - name: Generate deterministic OFAT pilot evidence
        run: >-
          python -m rgm.experiments.hlg_m3_benchmark_generator
          --manifest docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json
          --output results/hlg_m3_benchmark_bm0_bm1/bm2_pilot.json
          --pilot
      - name: Upload BM-2 pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-bm2-generator-pilot
          path: results/hlg_m3_benchmark_bm0_bm1/bm2_pilot.json
          if-no-files-found: error

  full-tests:
    name: Full repository tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full repository tests
        run: python -m pytest

  aggregate:
    name: Aggregate BM-0/BM-1 contract evidence
    runs-on: ubuntu-latest
    needs: [benchmark-contract, bm2-generator, full-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download BM-0/BM-1 contract artifact
        uses: actions/download-artifact@v4
        with:
          name: hlg-m3-bm0-bm1-contract-evidence
          path: results/hlg_m3_benchmark_bm0_bm1
      - name: Download BM-2 generator pilot
        uses: actions/download-artifact@v4
        with:
          name: hlg-m3-bm2-generator-pilot
          path: results/hlg_m3_benchmark_bm0_bm1
      - name: Verify contract and BM-2 evidence while preserving claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("results/hlg_m3_benchmark_bm0_bm1")
          expected = {"manifest_validation.json", "bm2_acceptance_a.json"}
          actual = {p.name for p in root.iterdir() if p.is_file()}
          assert actual == expected, {"expected": sorted(expected), "actual": sorted(actual)}
          evidence = json.loads((root / "manifest_validation.json").read_text())
          validation = evidence["validation"]
          pilot = json.loads((root / "bm2_acceptance_a.json").read_text())
          assert evidence["campaign_id"] == "HLG-M3-BROAD-BENCHMARK-BM0-BM1-v0.1"
          assert validation["valid"] is True
          assert validation["world_configuration_count"] == 40
          assert validation["replicate_stream_count"] == 200
          assert validation["resource_envelope"]["persistent_state_cap_bytes"] == 512
          assert validation["resource_envelope"]["trainable_parameter_cap"] == 4096
          assert validation["resource_envelope"]["update_multiply_add_cap_per_observed_update"] == 8192
          assert validation["resource_envelope"]["query_multiply_add_cap_per_prediction"] == 4096
          assert validation["primary_test_compositions"] == 8
          assert validation["all_primary_test_atoms_seen_in_fit"] is True
          assert validation["primitive_ood_separately_excluded"] is True
          assert validation["m3_protocol_frozen"] is False
          assert validation["m3_scientific_validation_complete"] is False
          assert pilot["campaign_id"] == "HLG-M3-BROAD-BENCHMARK-BM2-GENERATOR-v0.1"
          assert pilot["pilot_profile_count"] == 21\n          assert pilot["world_configuration_count"] == 40\n          assert pilot["replicate_stream_count"] == 200\n          assert pilot["all_confirmatory_streams_valid"] is True\n          assert pilot["all_confirmatory_streams_have_masks_and_hashes"] is True\n          assert pilot["confirmatory_streams_generated"] is True\n          assert pilot["independent_regeneration_required"] is True
          assert pilot["all_pilot_streams_regenerated_identically"] is True
          assert pilot["all_pilot_boundaries_valid"] is True
          assert pilot["legacy_f6_anchor"]["all_checks_passed"] is True
          assert pilot["confirmatory_streams_generated"] is True
          assert pilot["scientific_benchmark_executed"] is False
          assert pilot["m3_scientific_validation_complete"] is False
          assert pilot["manifest_sha256"] == evidence["manifest_sha256"]
          summary = {
              "campaign_id": evidence["campaign_id"],
              "manifest_sha256": evidence["manifest_sha256"],
              "contract_execution_passed": True,
              "bm2_generator_pilot_passed": True,
              "pilot_profile_count": pilot["pilot_profile_count"],
              "legacy_f6_anchor_passed": pilot["legacy_f6_anchor"]["all_checks_passed"],
              "confirmatory_streams_generated": True,\n              "world_configuration_count": pilot["world_configuration_count"],\n              "replicate_stream_count": pilot["replicate_stream_count"],\n              "all_confirmatory_streams_valid": pilot["all_confirmatory_streams_valid"],
              "world_configuration_count": validation["world_configuration_count"],
              "replicate_stream_count": validation["replicate_stream_count"],
              "resource_envelope": validation["resource_envelope"],
              "primary_test_compositions": validation["primary_test_compositions"],
              "scientific_benchmark_executed": False,
              "m3_protocol_frozen": True,
              "m3_scientific_validation_complete": False,
              "claim_ceiling": evidence["claim_ceiling"],
              "decision": "M3_G1_BM2_GENERATOR_ACCEPTANCE_CHECKED; SCIENTIFIC_CONFIRMATORY_BENCHMARK_NOT_RUN"
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-bm0-bm1-aggregate
          path: results/hlg_m3_benchmark_bm0_bm1/summary.json
          if-no-files-found: error
