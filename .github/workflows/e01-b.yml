name: E01-B capacity and interference frontier

on:
  push:
    branches: ["e01-b-capacity-frontier"]
    paths:
      - ".github/workflows/e01-b.yml"
      - "src/rgm/experiments/e01_b.py"
      - "src/rgm/experiments/e01_b_analysis.py"
      - "src/rgm/experiments/e01_b_determinism.py"
      - "tests/test_e01_b.py"
      - "docs/e01_b_determinism_audit.md"
  pull_request:
    branches: ["e01-a3-replication", "e01-b-capacity-frontier"]
    paths:
      - ".github/workflows/e01-b.yml"
      - "src/rgm/experiments/e01_b_determinism.py"
      - "src/rgm/experiments/e01_b.py"
      - "src/rgm/experiments/e01_b_analysis.py"
      - "tests/test_e01_b.py"
      - "docs/e01_b_determinism_audit.md"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unit and invariant tests
        run: python -m pytest

  e01-b-frontier:
    name: E01-B / ${{ matrix.condition }} / ${{ matrix.memory_arm }} / world ${{ matrix.world_seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        condition:
          - entity_e4
          - entity_e8
          - entity_e16
          - entity_e32
          - facts_f4
          - facts_f8
          - facts_f16
          - facts_f32
          - facts_f64
          - distractors_d0
          - distractors_d4
          - distractors_d16
          - distractors_d32
          - gap_short
          - gap_medium
          - gap_long
          - depth_d1
          - depth_d2
          - depth_d3
        memory_arm: [slow_only, full_soe, current, window2, window8, full_history]
        world_seed: [401, 402]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run E01-B frontier cell
        run: |
          python -m rgm.experiments.e01_b \
            --condition ${{ matrix.condition }} \
            --memory-arm ${{ matrix.memory_arm }} \
            --world-seed ${{ matrix.world_seed }} \
            --output results/e01_b/ci-${{ matrix.condition }}-${{ matrix.memory_arm }}-w${{ matrix.world_seed }}.json
      - name: Upload frontier evidence
        uses: actions/upload-artifact@v4
        with:
          name: e01-b-${{ matrix.condition }}-${{ matrix.memory_arm }}-w${{ matrix.world_seed }}
          path: results/e01_b/ci-${{ matrix.condition }}-${{ matrix.memory_arm }}-w${{ matrix.world_seed }}.json
          if-no-files-found: error

  e01-b-determinism:
    name: E01-B deterministic replica ${{ matrix.replica }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Repeat the previously divergent cell
        run: |
          python -m rgm.experiments.e01_b \
            --condition entity_e4 \
            --memory-arm current \
            --world-seed 402 \
            --output results/e01_b/determinism-replica-${{ matrix.replica }}.json
      - name: Upload deterministic replica
        uses: actions/upload-artifact@v4
        with:
          name: e01-b-determinism-replica-${{ matrix.replica }}
          path: results/e01_b/determinism-replica-${{ matrix.replica }}.json
          if-no-files-found: error

  e01-b-determinism-check:
    name: E01-B deterministic replica comparison
    runs-on: ubuntu-latest
    needs: [e01-b-determinism]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download independent replicas
        uses: actions/download-artifact@v4
        with:
          pattern: e01-b-determinism-replica-*
          path: results/e01_b/determinism
          merge-multiple: true
      - name: Compare independent CI outputs
        run: |
          python -m rgm.experiments.e01_b_determinism \
            --input-dir results/e01_b/determinism \
            --output results/e01_b/determinism_check.json
      - name: Upload determinism audit
        uses: actions/upload-artifact@v4
        with:
          name: e01-b-determinism-check
          path: results/e01_b/determinism_check.json
          if-no-files-found: error
  e01-b-summary:
    name: E01-B frontier summary
    runs-on: ubuntu-latest
    needs: [e01-b-frontier, e01-b-determinism-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download all frontier cells
        uses: actions/download-artifact@v4
        with:
          pattern: e01-b-*
          path: results/e01_b
          merge-multiple: true
      - name: Compute capacity and interference frontier
        run: |
          python -m rgm.experiments.e01_b_analysis \
            --input-dir results/e01_b \
            --output results/e01_b/paired_summary.json
      - name: Upload frontier summary
        uses: actions/upload-artifact@v4
        with:
          name: e01-b-frontier-summary
          path: results/e01_b/paired_summary.json
          if-no-files-found: error
