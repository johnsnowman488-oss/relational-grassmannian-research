name: bAbI Tasks 3 and 5 matched HLA-HLB learning campaign

on:
  workflow_dispatch:
  push:
    branches:
      - "research/h1-babi-learning-campaign-v1-1"
      - "research/h1-babi-execution-recovery-v1"
      - "research/h1-babi-prediction-contract-v1"
    paths:
      - "src/rgm/experiments/babi_learning_campaign.py"
      - "src/rgm/experiments/babi_annotation.py"
      - "src/rgm/experiments/babi_synthetic_confirmatory.py"
      - "scripts/run_babi_learning_campaign.py"
      - "scripts/select_babi_learning_candidates.py"
      - "scripts/verify_babi_confirmatory.py"
      - "scripts/annotate_babi_structured.py"
      - "scripts/generate_babi_confirmatory.py"
      - "src/rgm/leptograph/m4/evidence.py"
      - "src/rgm/leptograph/m4/hierarchical.py"
      - "src/rgm/leptograph/m4/learning.py"
      - "tests/test_babi_learning_campaign.py"
      - "tests/test_hlg_learning_mechanisms.py"
      - "tests/test_hlg_learning_runtime_integration.py"
      - "tests/test_hlg_learning_episode_boundary.py"
      - ".github/workflows/h1-babi-learning-campaign.yml"
  pull_request:
    branches: ["research/h1-learning-runtime-integration"]
    paths:
      - "src/rgm/experiments/babi_learning_campaign.py"
      - "src/rgm/experiments/babi_annotation.py"
      - "src/rgm/experiments/babi_synthetic_confirmatory.py"
      - "scripts/run_babi_learning_campaign.py"
      - "scripts/select_babi_learning_candidates.py"
      - "scripts/verify_babi_confirmatory.py"
      - "scripts/annotate_babi_structured.py"
      - "scripts/generate_babi_confirmatory.py"
      - "src/rgm/leptograph/m4/evidence.py"
      - "src/rgm/leptograph/m4/hierarchical.py"
      - "src/rgm/leptograph/m4/learning.py"
      - "tests/test_babi_learning_campaign.py"
      - "tests/test_hlg_learning_mechanisms.py"
      - "tests/test_hlg_learning_runtime_integration.py"
      - "tests/test_hlg_learning_episode_boundary.py"
      - ".github/workflows/h1-babi-learning-campaign.yml"

# Serialize campaign runs for this head branch, but never cancel an in-flight run.
# A push and its corresponding pull_request event therefore cannot duplicate a campaign.
concurrency:
  group: babi-learning-campaign-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-data:
    name: Freeze, annotate and generate confirmatory inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Freeze official bAbI source
        run: python scripts/freeze_babi_tasks.py
      - name: Build and audit source-indexed annotations
        run: python scripts/annotate_babi_structured.py
      - name: Generate label-free confirmatory challenge
        run: python scripts/generate_babi_confirmatory.py
      - name: Upload frozen campaign inputs
        uses: actions/upload-artifact@v4
        with:
          name: babi-learning-inputs
          path: |
            data/babi-v1.2/
            artifacts/babi-structured/
            artifacts/babi-confirmatory/
          if-no-files-found: error
          compression-level: 6

  build-native:
    name: Build pinned Aberconics C++ hierarchy runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Aberconics runtime
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: aberconics
      - name: Verify pinned source commit
        working-directory: aberconics
        run: test "$(git rev-parse HEAD)" = "2539df6bda7ef3c9dd7c707abe26eff8bdbb59de"
      - name: Configure and build native shared library
        run: |
          cmake -S "aberconics/code/c++ core" -B "aberconics/code/c++ core/build-shared" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGFE_BUILD_TESTS=OFF -DGFE_BUILD_APPS=OFF
          cmake --build "aberconics/code/c++ core/build-shared" --parallel 2
      - name: Verify and upload native library
        run: |
          mkdir -p native
          cp "aberconics/code/c++ core/build-shared/libgfe_core.so" native/libgfe_core.so
          test -s native/libgfe_core.so
          sha256sum native/libgfe_core.so | tee native/libgfe_core.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: babi-pinned-native-runtime
          path: native/
          if-no-files-found: error

  contract-tests:
    name: Prediction, task-channel and ablation contract tests
    needs: [prepare-data, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify prediction lifecycle, task calibration and six ablations
        run: |
          python -m pytest -q \
            tests/test_babi_learning_campaign.py \
            tests/test_hlg_learning_mechanisms.py \
            tests/test_hlg_learning_runtime_integration.py \
            tests/test_hlg_learning_episode_boundary.py

  matched-campaigns:
    name: Task ${{ matrix.task }} — ${{ matrix.architecture }}
    needs: [prepare-data, build-native, contract-tests]
    runs-on: ubuntu-latest
    # Recovery and prediction-contract branches run one-seed acceptance pilots.
    # The full matched campaign retains a six-hour ceiling, with incremental
    # story/phase progress and completed-condition evidence uploads.
    timeout-minutes: ${{ contains(fromJSON('["research/h1-babi-execution-recovery-v1","research/h1-babi-prediction-contract-v1"]'), github.ref_name) && 90 || 360 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { task: 3, architecture: HLA }
          - { task: 3, architecture: HLB }
          - { task: 5, architecture: HLA }
          - { task: 5, architecture: HLB }
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Aberconics Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: vendor/aberconics-framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # The input artifact preserves its repository-relative paths. The native
      # artifact stores the two native files at ZIP root, so download it into
      # native/ rather than merging all artifacts into the workspace root.
      - name: Download frozen campaign inputs
        uses: actions/download-artifact@v4
        with:
          name: babi-learning-inputs
          path: .
      - name: Download pinned native runtime into expected directory
        uses: actions/download-artifact@v4
        with:
          name: babi-pinned-native-runtime
          path: native
      - name: Verify native artifact and input manifests
        run: |
          test -s native/libgfe_core.so
          test -s native/libgfe_core.sha256
          sha256sum -c native/libgfe_core.sha256
          test -s artifacts/babi-structured/annotation-manifest.json
          test -s artifacts/babi-confirmatory/confirmatory-input-manifest.json
      - name: Run selected matched campaign seed-condition set
        env:
          GFE_CORE_LIB: ${{ github.workspace }}/native/libgfe_core.so
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/vendor/aberconics-framework/code/python
          GFE_ABERCONICS_COMMIT: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p artifacts/babi-campaign
          if [[ "$GITHUB_REF_NAME" == "research/h1-babi-execution-recovery-v1" || "$GITHUB_REF_NAME" == "research/h1-babi-prediction-contract-v1" ]]; then
            # Fresh-branch safety pilot: one fixed seed across all six
            # frozen conditions for each task/architecture. The full 10-seed
            # confirmatory campaign remains a separate acceptance gate.
            python -u scripts/run_babi_learning_campaign.py \
              --task-id ${{ matrix.task }} \
              --architecture ${{ matrix.architecture }} \
              --seeds 953000 \
              --variants full_learning no_temporal no_relational no_abstraction no_task no_learning \
              --output artifacts/babi-campaign/task${{ matrix.task }}-${{ matrix.architecture }}.json
          else
            python -u scripts/run_babi_learning_campaign.py \
              --task-id ${{ matrix.task }} \
              --architecture ${{ matrix.architecture }} \
              --output artifacts/babi-campaign/task${{ matrix.task }}-${{ matrix.architecture }}.json
          fi
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-task${{ matrix.task }}-${{ matrix.architecture }}-campaign
          path: artifacts/babi-campaign/
          if-no-files-found: warn
          compression-level: 6

  candidate-selection:
    name: Validate all ablations and freeze full-learning candidates
    needs: [matched-campaigns]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all four matched worker artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: babi-task*-*-campaign
          path: artifacts/pilot
          merge-multiple: true
      - name: Verify evidence parity, ablation manipulations and select candidates from validation only
        run: |
          mkdir -p artifacts/selection
          if [[ "$GITHUB_REF_NAME" == "research/h1-babi-execution-recovery-v1" || "$GITHUB_REF_NAME" == "research/h1-babi-prediction-contract-v1" ]]; then
            python scripts/select_babi_learning_candidates.py \
              --input-dir artifacts/pilot \
              --output artifacts/selection/selected-candidates.json \
              --seeds 953000
          else
            python scripts/select_babi_learning_candidates.py \
              --input-dir artifacts/pilot/artifacts/babi-campaign \
              --output artifacts/selection/selected-candidates.json \
              --seeds 953000 953001 953002 953003 953004 953005 953006 953007 953008 953009
          fi
      - name: Upload validation-only candidate selection lock
        uses: actions/upload-artifact@v4
        with:
          name: babi-selected-candidates
          path: artifacts/selection/selected-candidates.json
          if-no-files-found: error

  confirmatory-campaigns:
    name: One-time confirmatory — Task ${{ matrix.task }} ${{ matrix.architecture }}
    needs: [candidate-selection, prepare-data, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { task: 3, architecture: HLA }
          - { task: 3, architecture: HLB }
          - { task: 5, architecture: HLA }
          - { task: 5, architecture: HLB }
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Aberconics Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: vendor/aberconics-framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download frozen inputs, native runtime and selection lock
        uses: actions/download-artifact@v4
        with:
          name: babi-learning-inputs
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: babi-pinned-native-runtime
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: babi-selected-candidates
          path: artifacts/selection
      - name: Verify native runtime and selected candidate lock
        run: |
          sha256sum -c native/libgfe_core.sha256
          test -s artifacts/selection/selected-candidates.json
      - name: Reconstruct and evaluate the selected full-learning candidate once
        env:
          GFE_CORE_LIB: ${{ github.workspace }}/native/libgfe_core.so
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/vendor/aberconics-framework/code/python
          GFE_ABERCONICS_COMMIT: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p artifacts/babi-confirmatory-results
          python -u scripts/run_babi_learning_campaign.py \
            --task-id ${{ matrix.task }} \
            --architecture ${{ matrix.architecture }} \
            --phase confirmatory \
            --selection-file artifacts/selection/selected-candidates.json \
            --output artifacts/babi-confirmatory-results/task${{ matrix.task }}-${{ matrix.architecture }}.json
      - name: Upload one-time confirmatory result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-task${{ matrix.task }}-${{ matrix.architecture }}-confirmatory
          path: artifacts/babi-confirmatory-results/
          if-no-files-found: warn
          compression-level: 6

  verify-confirmatory:
    name: Verify one-time confirmatory lock and parity
    needs: [confirmatory-campaigns, candidate-selection]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download selected candidate lock and four confirmatory outputs
        uses: actions/download-artifact@v4
        with:
          pattern: babi-task*-*-confirmatory
          path: artifacts/confirmatory
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: babi-selected-candidates
          path: artifacts/selection
      - name: Verify exactly one confirmatory evaluation per task and architecture
        run: |
          python scripts/verify_babi_confirmatory.py \
            --input-dir artifacts/confirmatory \
            --selection-file artifacts/selection/selected-candidates.json
