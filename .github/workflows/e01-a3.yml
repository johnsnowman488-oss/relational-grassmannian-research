name: E01-A3 independent-world and codebook replication

on:
  push:
    branches: ["e01-a3-replication"]
    paths:
      - "src/rgm/experiments/e01.py"
      - "src/rgm/experiments/e01_a3.py"
      - "src/rgm/experiments/e01_a3_analysis.py"
      - "tests/test_e01_a3.py"
  pull_request:
    branches: ["e01-a2-diagnostic-audit"]
    paths:
      - "src/rgm/experiments/e01.py"
      - "src/rgm/experiments/e01_a3.py"
      - "src/rgm/experiments/e01_a3_analysis.py"
      - "tests/test_e01_a3.py"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unit and invariant tests
        run: python -m pytest

  e01-a3-replications:
    name: E01-A3 / ${{ matrix.configuration }} / world ${{ matrix.world_seed }} / codebook ${{ matrix.codebook_seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        configuration: [full_max, slow_only_max, drop_slow_max, drop_channel2_max, full_same, full_mean]
        world_seed: [101, 202, 303]
        codebook_seed: [9137, 27183, 65537]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run independent E01-A3 cell
        run: |
          python -m rgm.experiments.e01_a3 \
            --configuration ${{ matrix.configuration }} \
            --world-seed ${{ matrix.world_seed }} \
            --codebook-seed ${{ matrix.codebook_seed }} \
            --output results/e01_a3/ci-${{ matrix.configuration }}-w${{ matrix.world_seed }}-c${{ matrix.codebook_seed }}.json
      - name: Upload replicated per-sequence evidence
        uses: actions/upload-artifact@v4
        with:
          name: e01-a3-${{ matrix.configuration }}-w${{ matrix.world_seed }}-c${{ matrix.codebook_seed }}
          path: results/e01_a3/ci-${{ matrix.configuration }}-w${{ matrix.world_seed }}-c${{ matrix.codebook_seed }}.json
          if-no-files-found: error

  e01-a3-summary:
    name: E01-A3 paired replication summary
    runs-on: ubuntu-latest
    needs: [e01-a3-replications]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download all replicated cells
        uses: actions/download-artifact@v4
        with:
          pattern: e01-a3-*
          path: results/e01_a3
          merge-multiple: true
      - name: Compute replicate-level paired summary
        run: |
          python -m rgm.experiments.e01_a3_analysis \
            --input-dir results/e01_a3 \
            --output results/e01_a3/paired_summary.json
      - name: Upload replication summary
        uses: actions/upload-artifact@v4
        with:
          name: e01-a3-paired-summary
          path: results/e01_a3/paired_summary.json
          if-no-files-found: error
