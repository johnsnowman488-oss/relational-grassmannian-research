name: Hybrid Relational Leptograph M3 Foundation Campaign

on:
  push:
    branches: [research/hybrid-relational-leptograph-m3-foundation-campaign]
    paths:
      - "docs/hybrid_leptograph_m3_foundation_proposal.md"
      - "docs/hybrid_leptograph_m3_foundation_campaign_plan.md"
      - "src/rgm/experiments/leptograph_m3_foundation_campaign.py"
      - "tests/test_leptograph_m3_foundation_campaign.py"
      - ".github/workflows/hybrid-leptograph-m3-foundation-campaign.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/hybrid_leptograph_m3_foundation_proposal.md"
      - "docs/hybrid_leptograph_m3_foundation_campaign_plan.md"
      - "src/rgm/experiments/leptograph_m3_foundation_campaign.py"
      - "tests/test_leptograph_m3_foundation_campaign.py"
      - ".github/workflows/hybrid-leptograph-m3-foundation-campaign.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Full repository tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full repository test suite
        run: python -m pytest

  design-jobs:
    name: M3 mathematical design ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        job: [F1, F2, F3, F4, F5, F6, F7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install numerical research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Execute independent mathematical design job
        run: >-
          python -m rgm.experiments.leptograph_m3_foundation_campaign
          --case ${{ matrix.job }}
          --output results/leptograph_m3_foundation/${{ matrix.job }}.json
      - name: Upload independent design evidence
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-leptograph-m3-foundation-${{ matrix.job }}
          path: results/leptograph_m3_foundation/${{ matrix.job }}.json
          if-no-files-found: error

  aggregate:
    name: Verify complete F1-F7 design evidence
    runs-on: ubuntu-latest
    needs: [design-jobs, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download all independent design evidence
        uses: actions/download-artifact@v4
        with:
          pattern: hybrid-leptograph-m3-foundation-F*
          path: results/leptograph_m3_foundation
          merge-multiple: true
      - name: Require all seven design jobs and record open decisions
        run: >-
          python -m rgm.experiments.leptograph_m3_foundation_campaign
          --verify-result-dir results/leptograph_m3_foundation
          --output results/leptograph_m3_foundation/summary.json
      - name: Upload canonical design campaign summary
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-leptograph-m3-foundation-summary
          path: results/leptograph_m3_foundation/summary.json
          if-no-files-found: error
