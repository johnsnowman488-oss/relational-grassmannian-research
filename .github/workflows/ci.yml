name: Repository unit and invariant tests

on:
  push:
    branches: [main, "e00-foundations", "e01-history-dependence", "e01-a2-diagnostic-audit", "research/h0-shared-hierarchy-contract-soe-bridge"]
  pull_request:
    branches: [main, "research/hlg-m4-preimplementation-ledger", "research/h0-shared-hierarchy-contract-soe-bridge"]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unit and invariant tests
        run: python -m pytest
