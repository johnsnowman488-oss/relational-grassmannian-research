name: E00, E01-A, and E01-A2 validation

on:
  push:
    branches: [main, "e00-foundations", "e01-history-dependence"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unit and invariant tests
        run: python -m pytest

  e01-variants:
    name: E01-A / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        variant: [soe, current, window2, window8, reset, slow_only, fast_only, shuffled, full_history]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run independent E01-A control
        run: python -m rgm.experiments.e01 --variant ${{ matrix.variant }} --output results/e01/ci-${{ matrix.variant }}.json
      - name: Upload E01-A result
        uses: actions/upload-artifact@v4
        with:
          name: e01-${{ matrix.variant }}
          path: results/e01/ci-${{ matrix.variant }}.json
          if-no-files-found: error

  e01-a2-diagnostics:
    name: E01-A2 / ${{ matrix.memory-config }} / ${{ matrix.readout }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        memory-config: [full, only_0, only_1, only_2, only_3, drop_0, drop_1, drop_2, drop_3]
        readout: [max_channel, same_channel, mean_channel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run E01-A2 diagnostic cell
        run: |
          python -m rgm.experiments.e01_a2 \
            --memory-config ${{ matrix.memory-config }} \
            --readout ${{ matrix.readout }} \
            --output results/e01_a2/ci-${{ matrix.memory-config }}-${{ matrix.readout }}.json
      - name: Upload per-sequence diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: e01-a2-${{ matrix.memory-config }}-${{ matrix.readout }}
          path: results/e01_a2/ci-${{ matrix.memory-config }}-${{ matrix.readout }}.json
          if-no-files-found: error

  e01-a2-paired-summary:
    name: E01-A2 paired summary
    runs-on: ubuntu-latest
    needs: [e01-a2-diagnostics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download all diagnostic cells
        uses: actions/download-artifact@v4
        with:
          pattern: e01-a2-*
          path: results/e01_a2
          merge-multiple: true
      - name: Compute paired comparisons against full/max-channel
        run: |
          python -m rgm.experiments.e01_a2_analysis \
            --input-dir results/e01_a2 \
            --output results/e01_a2/paired_summary.json
      - name: Upload paired summary
        uses: actions/upload-artifact@v4
        with:
          name: e01-a2-paired-summary
          path: results/e01_a2/paired_summary.json
          if-no-files-found: error
