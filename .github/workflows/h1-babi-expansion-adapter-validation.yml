name: bAbI Phase B independent adapter validation

on:
  push:
    branches:
      - "research/babi-task-expansion-v1"
    paths:
      - "src/rgm/experiments/babi_expansion_adapters.py"
      - "scripts/freeze_babi_expansion_sources.py"
      - "scripts/audit_babi_expansion.py"
      - "tests/test_babi_expansion_adapters.py"
      - "tests/test_babi_expansion_source_freeze.py"
      - "tests/test_babi_task_expansion.py"
      - ".github/workflows/h1-babi-expansion-adapter-validation.yml"
  pull_request:
    branches:
      - "research/babi-task-expansion-v1"
    paths:
      - "src/rgm/experiments/babi_expansion_adapters.py"
      - "scripts/freeze_babi_expansion_sources.py"
      - "scripts/audit_babi_expansion.py"
      - "tests/test_babi_expansion_adapters.py"
      - "tests/test_babi_expansion_source_freeze.py"
      - "tests/test_babi_task_expansion.py"
      - ".github/workflows/h1-babi-expansion-adapter-validation.yml"

concurrency:
  group: babi-expansion-adapter-validation-\${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  adapter-validation:
    name: Task 11 / 14 / 19 contracts and source-wide audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run isolated adapter and source-freeze tests
        run: |
          python -m pytest -q \
            tests/test_babi_expansion_adapters.py \
            tests/test_babi_expansion_source_freeze.py \
            tests/test_babi_task_expansion.py
      - name: Acquire pinned external source members
        run: python scripts/freeze_babi_expansion_sources.py --output data/babi-v1.2-expansion
      - name: Parse all six members, derive whole-story validation and audit task oracles
        run: |
          python scripts/audit_babi_expansion.py \
            --source-root data/babi-v1.2-expansion \
            --output-root artifacts/babi-expansion \
            --max-quarantine-fraction 0.005
      - name: Upload Phase B adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-phase-b-adapter-validation
          path: |
            artifacts/babi-expansion/
            data/babi-v1.2-expansion/source-audit.json
          if-no-files-found: warn
          compression-level: 6
