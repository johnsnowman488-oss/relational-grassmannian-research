name: HLG-M3 G2 Implementation Readiness

on:
  push:
    branches: [research/hlg-m3-g2-confirmatory-campaign]
    paths:
      - "src/rgm/experiments/hlg_m3_g2_readiness.py"
      - "src/rgm/experiments/hlg_m3_g2_confirmatory.py"
      - "src/rgm/experiments/hlg_m3_g2_verify.py"
      - "src/rgm/leptograph/m3/resource.py"
      - "src/rgm/leptograph/m3/context.py"
      - "src/rgm/leptograph/m3/activation.py"
      - "src/rgm/leptograph/m3/controls.py"
      - "src/rgm/experiments/hlg_m3_g2_structural_preflight.py"
      - "src/rgm/leptograph/m3/revision_campaign.py"
      - "src/rgm/leptograph/m3/__init__.py"
      - "src/rgm/leptograph/m3/estimation.py"
      - "tests/test_hlg_m3_g2_readiness.py"
      - "tests/test_hlg_m3_g2_confirmatory.py"
      - "tests/test_hlg_m3_g2_structural_preflight.py"
      - "tests/test_hlg_m3_candidate_lifecycle.py"
      - "docs/hybrid_leptograph_m3_g2_implementation_readiness_v0_1.md"
      - ".github/workflows/hlg-m3-g2-readiness.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/rgm/experiments/hlg_m3_g2_readiness.py"
      - "src/rgm/leptograph/m3/revision_campaign.py"
      - "src/rgm/leptograph/m3/__init__.py"
      - "src/rgm/leptograph/m3/estimation.py"
      - "tests/test_hlg_m3_g2_readiness.py"
      - "tests/test_hlg_m3_candidate_lifecycle.py"
      - "docs/hybrid_leptograph_m3_g2_implementation_readiness_v0_1.md"
      - ".github/workflows/hlg-m3-g2-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-audit:
    name: Audit frozen G2 entry requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test masked updates, candidate lifecycle and G2 readiness
        run: python -m pytest tests/test_hlg_m3_g2_readiness.py tests/test_hlg_m3_g2_structural_preflight.py tests/test_hlg_m3_candidate_lifecycle.py
      - name: Produce G2 readiness evidence
        run: >-
          python -m rgm.experiments.hlg_m3_g2_readiness
          --root .
          --output results/hlg_m3_g2_readiness/readiness.json
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-g2-readiness-evidence
          path: results/hlg_m3_g2_readiness/readiness.json
          if-no-files-found: error

  confirmatory-campaign:
    name: Execute frozen G2 200-stream campaign
    runs-on: ubuntu-latest
    needs: [readiness-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: hlg-m3-g2-readiness-evidence
          path: results/hlg_m3_g2_readiness
      - name: Confirm frozen G2 entry identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("results/hlg_m3_g2_readiness/readiness.json").read_text())
          assert report["g1"]["manifest_identity_matches"] is True
          assert report["ready_to_start_g2"] is True, report["blockers"]
          PY
      - name: Execute all 200 confirmatory streams and six packages
        run: >-
          python -m rgm.experiments.hlg_m3_g2_confirmatory
          --manifest docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json
          --output-dir results/hlg_m3_g2_confirmatory
      - name: Verify package and aggregate evidence
        run: >-
          python -m rgm.experiments.hlg_m3_g2_verify
          --manifest docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json
          --output-dir results/hlg_m3_g2_confirmatory
      - name: Upload G2 confirmatory evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-g2-confirmatory-evidence
          path: results/hlg_m3_g2_confirmatory/*.json
          if-no-files-found: error

  full-tests:
    name: Full repository tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full repository tests
        run: python -m pytest

  aggregate:
    name: Aggregate G2 readiness and test evidence
    runs-on: ubuntu-latest
    needs: [readiness-audit, confirmatory-campaign]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: hlg-m3-g2-readiness-evidence
          path: results/hlg_m3_g2_readiness
      - uses: actions/download-artifact@v4
        with:
          name: hlg-m3-g2-confirmatory-evidence
          path: results/hlg_m3_g2_confirmatory
      - name: Verify G1 identity, G2 blocker disclosure and scientific claim ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("results/hlg_m3_g2_readiness")
          expected = {"readiness.json"}
          actual = {p.name for p in root.glob("*.json")}
          assert actual == expected, {"expected": sorted(expected), "actual": sorted(actual)}
          report = json.loads((root / "readiness.json").read_text(encoding="utf-8"))
          assert report["g1"]["accepted"] is True
          assert report["g1"]["manifest_identity_matches"] is True
          assert report["g1"]["manifest_validation_passed"] is True
          assert report["g1"]["world_configuration_count"] == 40
          assert report["g1"]["replicate_stream_count"] == 200
          assert report["scientific_benchmark_executed"] is False
          assert report["m3_scientific_validation_complete"] is False
          assert report["ready_to_start_g2"] == (len(report["blockers"]) == 0)
          campaign = json.loads(Path("results/hlg_m3_g2_confirmatory/aggregate.json").read_text(encoding="utf-8"))
          summary = {
              "readiness_id": report["readiness_id"],
              "g2_campaign": {
                  "stream_count": campaign["stream_count"],
                  "test_world_count": campaign["test_world_count"],
                  "capability_gate_passed": campaign["capability_gate"]["passed"],
                  "adaptation_gate_passed": campaign["adaptation_gate"]["passed"],
                  "resource_gate_passed": campaign["resource_gate"]["passed"],
                  "m4_authorised": campaign["m4_authorised"],
                  "aggregate_sha256": campaign["aggregate_sha256"],
              },
              "campaign_id": report["campaign_id"],
              "g1_accepted": report["g1"]["accepted"],
              "manifest_sha256": report["g1"]["manifest_sha256_observed"],
              "numeric_buffer_lower_bound_bytes": report["observed_interfaces"]["structural_preflight"]["resource_lower_bound"]["numeric_buffer_lower_bound_bytes"],
              "persistent_state_cap_bytes": report["observed_interfaces"]["structural_preflight"]["resource_lower_bound"]["persistent_state_cap_bytes"],
              "blocker_ids": [item["id"] for item in report["blockers"]],
              "warning_ids": [item["id"] for item in report["warnings"]],
              "ready_to_start_g2": report["ready_to_start_g2"],
              "decision": (
                  "G2_IMPLEMENTATION_READY; CONFIRMATORY_RUN_NOT_YET_TRIGGERED"
                  if report["ready_to_start_g2"]
                  else "G2_IMPLEMENTATION_BLOCKED; CONFIRMATORY_RUN_NOT_TRIGGERED"
              ),
              "scientific_benchmark_executed": False,
              "m3_scientific_validation_complete": False,
              "claim_ceiling": report["claim_ceiling"],
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload aggregate readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-g2-readiness-aggregate
          path: results/hlg_m3_g2_readiness/summary.json
          if-no-files-found: error
