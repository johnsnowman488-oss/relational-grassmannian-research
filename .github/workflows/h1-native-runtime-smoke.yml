name: H1 compiled native runtime smoke

on:
  pull_request:
    branches: ["research/h0-shared-hierarchy-contract-soe-bridge"]
    paths:
      - "src/rgm/leptograph/m4/**"
      - "scripts/h1_native_runtime_smoke.py"
      - ".github/workflows/h1-native-runtime-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled-native-hla-hlb:
    name: Build M4 shared library and exercise HLA/HLB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          path: research

      - name: Checkout pinned Aberconics M4 runtime
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: aberconics

      - name: Record native source identity
        id: source
        working-directory: aberconics
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Configure compiled shared library
        run: |
          cmake -S "aberconics/code/c++ core" -B "aberconics/code/c++ core/build-shared" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGFE_BUILD_TESTS=OFF \
            -DGFE_BUILD_APPS=OFF

      - name: Build compiled shared library
        run: cmake --build "aberconics/code/c++ core/build-shared" --parallel 2

      - name: Verify native library artifact
        id: library
        run: |
          LIB="$GITHUB_WORKSPACE/aberconics/code/c++ core/build-shared/libgfe_core.so"
          test -s "$LIB"
          echo "path=$LIB" >> "$GITHUB_OUTPUT"
          sha256sum "$LIB"

      - name: Install research package and integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "research[dev]"

      - name: Run HLA and HLB against compiled C++ runtime
        env:
          GFE_CORE_LIB: ${{ steps.library.outputs.path }}
          ABERCONICS_PYTHON: ${{ github.workspace }}/aberconics/code/python
          ABERCONICS_COMMIT: ${{ steps.source.outputs.commit }}
          PYTHONPATH: ${{ github.workspace }}/research/src
        run: python research/scripts/h1_native_runtime_smoke.py

      - name: Upload native integration manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-native-runtime-smoke
          path: |
            aberconics/code/c++ core/build-shared/libgfe_core.so
          if-no-files-found: warn
