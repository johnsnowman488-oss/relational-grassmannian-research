name: HLG-M3 G2 Detector Telemetry Replay

on:
  push:
    branches: [research/hlg-m3-g2-detector-telemetry]
    paths:
      - "src/rgm/experiments/hlg_m3_g2_confirmatory.py"
      - "src/rgm/experiments/hlg_m3_g2_detector_telemetry.py"
      - "tests/test_hlg_m3_g2_detector_telemetry.py"
      - ".github/workflows/hlg-m3-g2-detector-telemetry.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/rgm/experiments/hlg_m3_g2_confirmatory.py"
      - "src/rgm/experiments/hlg_m3_g2_detector_telemetry.py"
      - "tests/test_hlg_m3_g2_detector_telemetry.py"
      - ".github/workflows/hlg-m3-g2-detector-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-replay:
    name: Replay frozen G2 test streams and verify detector events
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Execute telemetry-only replay on frozen G2 manifest
        run: >-
          python -m rgm.experiments.hlg_m3_g2_detector_telemetry
          --manifest docs/hybrid_leptograph_m3_benchmark_split_manifest_v0_1.json
          --output results/hlg_m3_g2_detector_telemetry/telemetry.json
      - name: Verify exact replay of historical M3-D totals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("results/hlg_m3_g2_detector_telemetry/telemetry.json").read_text())
          assert report["original_m3_d_summary_reproduced"] is True
          assert report["scientific_tuning_performed"] is False
          assert report["test_outcomes_used_for_tuning"] is False
          assert report["test_worlds_used_for_threshold_selection"] is False
          assert report["integrity"]["exact_test_stream_count"] == 100
          assert report["integrity"]["exact_test_world_count"] == 20
          assert report["replayed_m3_d_summary"]["total_detector_alarms"] == 2592
          assert report["replayed_m3_d_summary"]["test_streams_with_alarms"] == 98
          print(json.dumps({
              "execution_status":"TELEMETRY_REPLAY_VERIFIED",
              "stream_count":len(report["streams"]),
              "total_detector_alarms":report["replayed_m3_d_summary"]["total_detector_alarms"],
              "by_drift_family":report["by_drift_family"],
              "evidence_sha256":report["evidence_sha256"],
          },sort_keys=True))
          PY
      - name: Upload G2 detector telemetry
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-g2-detector-telemetry
          path: results/hlg_m3_g2_detector_telemetry/telemetry.json
          if-no-files-found: error

  full-tests:
    name: Full repository tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full repository tests
        run: python -m pytest

  aggregate:
    name: Aggregate telemetry and test evidence
    runs-on: ubuntu-latest
    needs: [telemetry-replay, full-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: hlg-m3-g2-detector-telemetry
          path: results/hlg_m3_g2_detector_telemetry
      - name: Verify evidence hash and claim ceiling
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("results/hlg_m3_g2_detector_telemetry/telemetry.json")
          report=json.loads(p.read_text())
          stored=report.pop("evidence_sha256")
          payload=json.dumps(report,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          assert hashlib.sha256(payload).hexdigest()==stored
          assert report["original_m3_d_summary_reproduced"] is True
          assert report["scientific_tuning_performed"] is False
          summary={
              "campaign_id":report["campaign_id"],
              "source_campaign_id":report["source_campaign_id"],
              "stream_count":len(report["streams"]),
              "total_detector_alarms":report["replayed_m3_d_summary"]["total_detector_alarms"],
              "original_m3_d_summary_reproduced":report["original_m3_d_summary_reproduced"],
              "evidence_sha256":stored,
              "execution_status":"TELEMETRY_REPLAY_VERIFIED",
              "scientific_performance_gate_changed":False,
          }
          Path("results/hlg_m3_g2_detector_telemetry/summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,sort_keys=True))
          PY
      - name: Upload aggregate telemetry status
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-g2-detector-telemetry-aggregate
          path: results/hlg_m3_g2_detector_telemetry/summary.json
          if-no-files-found: error
