name: HLG-M4 frozen confirmatory A/B campaign

on:
  pull_request:
    branches: [research/hlg-m4-preimplementation-ledger]
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hlg-m4-confirmatory-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  confirmatory:
    if: github.event.label.name == 'm4-confirmatory-authorized' && github.event.pull_request.head.ref == 'm4/confirmatory-worlds-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Re-run repository unit and invariant suite
        run: python -m pytest
      - name: Verify frozen protocol and source revision
        env:
          EXPECTED_CONFIG_SHA256: a4df456185812fdee67edd939e13a049f3889ba2bf9f5256f746d8fdeb6c5218
          EXPECTED_PARTITION_SHA256: 488d16e20f766d26459075f2e57ae0c4d7b1c68a1696f9e41a0424a68ca095b7
        run: |
          mkdir -p "$RUNNER_TEMP/hlg-m4-confirmatory"
          actual_config="$(sha256sum docs/experiments/HLG_M4_CONFIRMATORY_CONFIG.json | cut -d ' ' -f 1)"
          test "$actual_config" = "$EXPECTED_CONFIG_SHA256"
          python - <<'PY'
          from rgm.experiments.m4_confirmatory_campaign import _load_config, _partitions
          from rgm.experiments.m4_confirmatory_worlds import partition_manifest
          import hashlib, json
          config, config_sha = _load_config()
          manifest = partition_manifest(_partitions(config))
          actual = hashlib.sha256(json.dumps(manifest, sort_keys=True).encode()).hexdigest()
          assert config["confirmatory_authorized"] is True
          assert config["confirmatory_test_accessed"] is False
          assert actual == "488d16e20f766d26459075f2e57ae0c4d7b1c68a1696f9e41a0424a68ca095b7"
          print(json.dumps({"config_sha256": config_sha, "partition_manifest_sha256": actual}, sort_keys=True))
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/hlg-m4-confirmatory/source-commit.txt"
          sha256sum docs/experiments/HLG_M4_CONFIRMATORY_CONFIG.json > "$RUNNER_TEMP/hlg-m4-confirmatory/config.sha256"
      - name: Execute frozen confirmatory A/B campaign
        run: |
          python -m rgm.experiments.m4_confirmatory_campaign "$RUNNER_TEMP/hlg-m4-confirmatory/confirmatory-results.json"
          sha256sum "$RUNNER_TEMP/hlg-m4-confirmatory/confirmatory-results.json" > "$RUNNER_TEMP/hlg-m4-confirmatory/confirmatory-results.sha256"
      - name: Upload confirmatory seed-level evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m4-confirmatory-ab-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hlg-m4-confirmatory/
          if-no-files-found: error
