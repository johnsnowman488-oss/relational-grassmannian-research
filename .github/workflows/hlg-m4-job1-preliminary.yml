name: HLG-M4 Job 1 P0/P1 preliminary validation
on:
  pull_request:
    branches: [research/hlg-m4-preimplementation-ledger]
    paths:
      - 'src/rgm/leptograph/m4/composition.py'
      - 'src/rgm/experiments/hlg_m4_job1.py'
      - 'tests/test_hlg_m4_p0_p1.py'
      - '.github/workflows/hlg-m4-job1-preliminary.yml'
permissions:
  contents: read
jobs:
  p0-p1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_hlg_m4_p0_p1.py
      - run: python -m rgm.experiments.hlg_m4_job1 "$RUNNER_TEMP/m4-job1-results.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hlg-m4-job1-p0-p1-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/m4-job1-results.json
          if-no-files-found: error
