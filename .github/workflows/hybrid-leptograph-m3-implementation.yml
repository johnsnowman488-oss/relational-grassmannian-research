name: HLG-M3 Final Refinement Campaign

on:
  push:
    branches: [research/hybrid-relational-leptograph-m3-implementation-v0.1]
    paths:
      - "docs/hybrid_leptograph_m3_refinement_protocol_v0_2.md"
      - "docs/hybrid_leptograph_m3_refinement_work_packages_v0_2.md"
      - "src/rgm/leptograph/m3/estimation.py"
      - "src/rgm/leptograph/m3/integration_refinement.py"
      - "src/rgm/experiments/leptograph_m3_refinement.py"
      - "tests/test_leptograph_m3_refinement.py"
      - ".github/workflows/hybrid-leptograph-m3-implementation.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/hybrid_leptograph_m3_refinement_protocol_v0_2.md"
      - "docs/hybrid_leptograph_m3_refinement_work_packages_v0_2.md"
      - "src/rgm/leptograph/m3/estimation.py"
      - "src/rgm/leptograph/m3/integration_refinement.py"
      - "src/rgm/experiments/leptograph_m3_refinement.py"
      - "tests/test_leptograph_m3_refinement.py"
      - ".github/workflows/hybrid-leptograph-m3-implementation.yml"

permissions:
  contents: read

jobs:
  refinement-work-packages:
    name: ${{ matrix.package }} refinement
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        package: [M3-A, M3-B, M3-C, M3-D, M3-E, M3-I]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Execute independent refinement package
        run: >-
          python -m rgm.experiments.leptograph_m3_refinement
          --work-package ${{ matrix.package }}
          --output results/leptograph_m3_refinement/${{ matrix.package }}.json
      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-refinement-${{ matrix.package }}
          path: results/leptograph_m3_refinement/${{ matrix.package }}.json
          if-no-files-found: error

  full-tests:
    name: Full repository tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full repository tests
        run: python -m pytest

  aggregate:
    name: Aggregate six refinement records
    runs-on: ubuntu-latest
    needs: [refinement-work-packages, full-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download six refinement artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hlg-m3-refinement-M3-*
          path: results/leptograph_m3_refinement
          merge-multiple: true
      - name: Verify exact evidence set and record scientific checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("results/leptograph_m3_refinement")
          expected = {f"M3-{x}.json" for x in ("A", "B", "C", "D", "E", "I")}
          actual = {p.name for p in root.glob("*.json")}
          assert actual == expected, {"expected": sorted(expected), "actual": sorted(actual)}
          records = [json.loads((root / name).read_text()) for name in sorted(expected)]
          assert all(r.get("campaign_id") == "HLG-M3-FINAL-REFINEMENT-v0.2" for r in records)
          assert all(r.get("execution_passed") is True for r in records)
          summary = {
              "campaign_id": "HLG-M3-FINAL-REFINEMENT-v0.2",
              "package_ids": [r["package_id"] for r in records],
              "package_count": len(records),
              "all_package_executions_completed": True,
              "scientific_checks": {r["package_id"]: r["measurements"].get("scientific_checks", {}) for r in records},
              "implementation_protocol_frozen": False,
              "m3_scientific_validation_complete": False,
              "decision": "FINAL_REFINEMENT_EXECUTED_REVIEW_EVIDENCE_BEFORE_BROAD_M3_BENCHMARK",
              "claim_ceiling": "one deterministic refinement campaign; no held-out composition generalisation, broad detector calibration, causal attribution, C0-C4 winner, or M4 global stability claim"
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: hlg-m3-final-refinement-summary
          path: results/leptograph_m3_refinement/summary.json
          if-no-files-found: error
