name: Task 11 full-scale campaign resource preflight

on:
  push:
    branches:
      - "research/task11-campaign-execution-v1"
    paths:
      - "src/rgm/experiments/babi_expansion_*.py"
      - "src/rgm/experiments/babi_task11_prediction.py"
      - "src/rgm/leptograph/m4/*.py"
      - "scripts/freeze_babi_expansion_sources.py"
      - "scripts/prepare_babi_task11_campaign.py"
      - "scripts/run_babi_task11_campaign_unit.py"
      - "scripts/aggregate_babi_task11_preflight.py"
      - "scripts/aggregate_babi_task11_campaign.py"
      - "scripts/evaluate_babi_task11_confirmatory.py"
      - "scripts/generate_babi_task11_confirmatory.py"
      - "tests/test_babi_task11_*.py"
      - "tests/test_hlg_m4_soe_bridge.py"
      - "docs/experiments/HLG_BABI_TASK11_LEARNING_CAMPAIGN_v1_0.json"
      - ".github/workflows/task11-full-scale-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task11-full-scale-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Full repository and Task 11 campaign contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Task 11 campaign and confirmatory runners
        run: |
          python -m py_compile \
            scripts/freeze_babi_expansion_sources.py \
            scripts/prepare_babi_task11_campaign.py \
            scripts/run_babi_task11_campaign_unit.py \
            scripts/aggregate_babi_task11_preflight.py \
            scripts/aggregate_babi_task11_campaign.py \
            scripts/generate_babi_task11_confirmatory.py \
            scripts/evaluate_babi_task11_confirmatory.py
      - name: Run complete repository test suite
        run: python -m pytest -q

  prepare-task11:
    name: Freeze Task 11 source and seed-specific partitions
    needs: [contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Acquire Task 11 source member only
        run: |
          python scripts/freeze_babi_expansion_sources.py \
            --tasks 11 \
            --output data/babi-v1.2-expansion
      - name: Prepare frozen Task 11 120-unit manifest
        run: |
          python scripts/prepare_babi_task11_campaign.py \
            --source-root data/babi-v1.2-expansion \
            --protocol docs/experiments/HLG_BABI_TASK11_LEARNING_CAMPAIGN_v1_0.json \
            --output-root artifacts/task11-campaign-plan
      - name: Upload Task 11 source and manifest (no evaluator labels)
        uses: actions/upload-artifact@v4
        with:
          name: babi-task11-campaign-inputs
          path: |
            data/babi-v1.2-expansion/qa11_basic-coreference_train.txt
            data/babi-v1.2-expansion/source-audit.json
            artifacts/task11-campaign-plan/task11-campaign-manifest.json
          if-no-files-found: error
          retention-days: 365

  build-native:
    name: Build pinned Aberconics native runtime
    needs: [contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Aberconics C++ source and Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: vendor/aberconics-framework
      - name: Verify pinned source commit
        working-directory: vendor/aberconics-framework
        run: test "$(git rev-parse HEAD)" = "2539df6bda7ef3c9dd7c707abe26eff8bdbb59de"
      - name: Configure and build native shared library
        run: |
          cmake -S "vendor/aberconics-framework/code/c++ core" \
            -B "vendor/aberconics-framework/code/c++ core/build-shared" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGFE_BUILD_TESTS=OFF -DGFE_BUILD_APPS=OFF
          cmake --build "vendor/aberconics-framework/code/c++ core/build-shared" --parallel 2
      - name: Verify and upload pinned native library
        run: |
          mkdir -p native
          cp "vendor/aberconics-framework/code/c++ core/build-shared/libgfe_core.so" native/libgfe_core.so
          test -s native/libgfe_core.so
          sha256sum native/libgfe_core.so | tee native/libgfe_core.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: babi-task11-pinned-native-runtime
          path: native/
          if-no-files-found: error
          retention-days: 365

  full-scale-preflight:
    name: Task 11 ${{ matrix.architecture }} ${{ matrix.condition }} full-scale preflight
    needs: [prepare-task11, build-native]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        architecture: [HLA, HLB]
        condition: [full_learning, no_learning]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Aberconics Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: vendor/aberconics-framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download Task 11 source and campaign manifest
        uses: actions/download-artifact@v4
        with:
          name: babi-task11-campaign-inputs
          path: .
      - name: Download pinned native runtime
        uses: actions/download-artifact@v4
        with:
          name: babi-task11-pinned-native-runtime
          path: native
      - name: Verify source and native pins
        run: |
          sha256sum -c native/libgfe_core.sha256
          test "$(git -C vendor/aberconics-framework rev-parse HEAD)" = "2539df6bda7ef3c9dd7c707abe26eff8bdbb59de"
      - name: Run complete 1,800-fit / 200-read-only-validation unit
        env:
          GFE_CORE_LIB: ${{ github.workspace }}/native/libgfe_core.so
          GFE_ABERCONICS_COMMIT: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/vendor/aberconics-framework/code/python
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_babi_task11_campaign_unit.py \
            --source-root data/babi-v1.2-expansion \
            --manifest artifacts/task11-campaign-plan/task11-campaign-manifest.json \
            --protocol docs/experiments/HLG_BABI_TASK11_LEARNING_CAMPAIGN_v1_0.json \
            --native-library native/libgfe_core.so \
            --python-abi-path vendor/aberconics-framework/code/python \
            --architecture ${{ matrix.architecture }} \
            --condition ${{ matrix.condition }} \
            --seed 953099 \
            --run-kind preflight \
            --output artifacts/task11-preflight/${{ matrix.architecture }}-${{ matrix.condition }}
      - name: Upload immutable full-scale preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-task11-preflight-${{ matrix.architecture }}-${{ matrix.condition }}
          path: artifacts/task11-preflight/${{ matrix.architecture }}-${{ matrix.condition }}/
          if-no-files-found: warn
          retention-days: 365

  accept-full-scale-preflight:
    name: Accept Task 11 full-scale resource and validation preflight
    needs: [full-scale-preflight]
    if: always() && needs.full-scale-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all four preflight reports
        uses: actions/download-artifact@v4
        with:
          pattern: babi-task11-preflight-*
          path: artifacts/preflight
      - name: Aggregate and accept full-scale Task 11 preflight
        run: |
          python scripts/aggregate_babi_task11_preflight.py \
            --reports \
              artifacts/preflight/babi-task11-preflight-HLA-full_learning/per-run-metrics.json \
              artifacts/preflight/babi-task11-preflight-HLA-no_learning/per-run-metrics.json \
              artifacts/preflight/babi-task11-preflight-HLB-full_learning/per-run-metrics.json \
              artifacts/preflight/babi-task11-preflight-HLB-no_learning/per-run-metrics.json \
            --output artifacts/task11-preflight-aggregate.json
      - name: Upload accepted or failed preflight aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-task11-full-scale-preflight-aggregate
          path: artifacts/task11-preflight-aggregate.json
          if-no-files-found: warn
          retention-days: 365

  campaign-units:
    name: Task 11 ${{ matrix.architecture }} ${{ matrix.condition }} seed ${{ matrix.seed }}
    needs: [prepare-task11, build-native, accept-full-scale-preflight]
    if: needs.accept-full-scale-preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        architecture: [HLA, HLB]
        condition: [full_learning, no_temporal, no_relational, no_abstraction, no_task, no_learning]
        seed: [953100, 953101, 953102, 953103, 953104, 953105, 953106, 953107, 953108, 953109]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Aberconics Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: vendor/aberconics-framework
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download frozen Task 11 source and campaign manifest
        uses: actions/download-artifact@v4
        with:
          name: babi-task11-campaign-inputs
          path: .
      - name: Download pinned native runtime
        uses: actions/download-artifact@v4
        with:
          name: babi-task11-pinned-native-runtime
          path: native
      - name: Verify source and native pins
        run: |
          sha256sum -c native/libgfe_core.sha256
          test "$(git -C vendor/aberconics-framework rev-parse HEAD)" = "2539df6bda7ef3c9dd7c707abe26eff8bdbb59de"
      - name: Execute frozen Task 11 campaign unit
        env:
          GFE_CORE_LIB: ${{ github.workspace }}/native/libgfe_core.so
          GFE_ABERCONICS_COMMIT: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/vendor/aberconics-framework/code/python
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_babi_task11_campaign_unit.py \
            --source-root data/babi-v1.2-expansion \
            --manifest artifacts/task11-campaign-plan/task11-campaign-manifest.json \
            --protocol docs/experiments/HLG_BABI_TASK11_LEARNING_CAMPAIGN_v1_0.json \
            --native-library native/libgfe_core.so \
            --python-abi-path vendor/aberconics-framework/code/python \
            --architecture ${{ matrix.architecture }} \
            --condition ${{ matrix.condition }} \
            --seed ${{ matrix.seed }} \
            --run-kind campaign \
            --output artifacts/task11-campaign/${{ matrix.architecture }}-${{ matrix.condition }}-seed${{ matrix.seed }}
      - name: Upload immutable Task 11 campaign unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-task11-campaign-${{ matrix.architecture }}-${{ matrix.condition }}-seed${{ matrix.seed }}
          path: artifacts/task11-campaign/${{ matrix.architecture }}-${{ matrix.condition }}-seed${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 365

  aggregate-campaign:
    name: Aggregate and select Task 11 validation candidates
    needs: [campaign-units, prepare-task11]
    if: always() && needs.campaign-units.result == 'success' && needs.prepare-task11.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen Task 11 manifest
        uses: actions/download-artifact@v4
        with:
          name: babi-task11-campaign-inputs
          path: .
      - name: Download all 120 campaign unit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: babi-task11-campaign-*
          path: artifacts/campaign-runs
      - name: Aggregate paired runs, bootstrap intervals and validation-only candidates
        run: |
          python scripts/aggregate_babi_task11_campaign.py \
            --manifest artifacts/task11-campaign-plan/task11-campaign-manifest.json \
            --protocol docs/experiments/HLG_BABI_TASK11_LEARNING_CAMPAIGN_v1_0.json \
            --run-root artifacts/campaign-runs \
            --output-root artifacts/task11-campaign-aggregate
      - name: Upload campaign aggregate and validation-only candidate selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-task11-campaign-aggregate
          path: artifacts/task11-campaign-aggregate/
          if-no-files-found: warn
          retention-days: 365

  confirmatory-evaluation:
    name: Generate and evaluate once-only Task 11 confirmatory challenge
    needs: [aggregate-campaign]
    if: always() && needs.aggregate-campaign.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download validation-only candidate selection
        uses: actions/download-artifact@v4
        with:
          name: babi-task11-campaign-aggregate
          path: artifacts/task11-campaign-aggregate
      - name: Download selected candidate model snapshots and all campaign evidence
        uses: actions/download-artifact@v4
        with:
          pattern: babi-task11-campaign-*
          path: artifacts/campaign-runs
      - name: Generate confirmatory challenge after candidate selection and evaluate once
        run: |
          python scripts/evaluate_babi_task11_confirmatory.py \
            --candidate-selection artifacts/task11-campaign-aggregate/candidate-selection.json \
            --campaign-run-root artifacts/campaign-runs \
            --output-root artifacts/task11-confirmatory
      - name: Upload separated confirmatory inputs, evaluator labels and scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-task11-confirmatory-report
          path: artifacts/task11-confirmatory/
          if-no-files-found: warn
          retention-days: 365
