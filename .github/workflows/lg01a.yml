name: LG-01A transient-mode campaign

on:
  pull_request:
    branches: [main]
    paths:
      - "src/rgm/experiments/lg01a.py"
      - "tests/test_lg01a.py"
      - "docs/lg01a_protocol.md"
      - "docs/lg01a_ledger.md"
      - ".github/workflows/lg01a.yml"
  push:
    branches: [main, "research/lgdh-lg01a-spine"]
    paths:
      - "src/rgm/experiments/lg01a.py"
      - "tests/test_lg01a.py"
      - "docs/lg01a_protocol.md"
      - "docs/lg01a_ledger.md"
      - ".github/workflows/lg01a.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: LG-01A tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full unit suite including LG-01A mathematical and reproducibility checks
        run: python -m pytest -q

  campaign:
    name: LG-01A 30-seed campaign
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Execute the frozen 30-seed campaign
        id: run
        env:
          LG01A_RUN_ID: lg01a_${{ github.run_id }}_${{ github.run_attempt }}
        shell: bash
        run: |
          set +e
          python -m rgm.experiments.lg01a --run-id "$LG01A_RUN_ID" --output-root results/lg01a
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "run_id=$LG01A_RUN_ID" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete LG-01A run bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lg01a-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/lg01a/${{ steps.run.outputs.run_id }}/
          if-no-files-found: error
          retention-days: 90
      - name: Propagate scientific gate outcome after preserving artifacts
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.run.outputs.exit_code }}" != "0" ]]; then
            echo "LG-01A campaign executed, but its pre-registered scientific gate failed."
            exit 1
          fi
          echo "LG-01A pre-registered scientific gate passed."