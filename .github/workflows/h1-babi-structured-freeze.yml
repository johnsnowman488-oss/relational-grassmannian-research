name: bAbI Tasks 3 and 5 source freeze

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/h0-shared-hierarchy-contract-soe-bridge"]
    paths:
      - "scripts/freeze_babi_tasks.py"
      - "docs/experiments/HLG_BABI_TASKS_3_5_STRUCTURED_CAMPAIGN_v0_1.json"
      - "src/rgm/experiments/babi_structured.py"
      - "tests/test_babi_structured.py"
      - ".github/workflows/h1-babi-structured-freeze.yml"

permissions:
  contents: read

jobs:
  freeze-and-structured-smoke:
    name: Verify official bAbI archive and structured-event fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Inspect available archive candidate without accepting it
        run: python scripts/freeze_babi_tasks.py --inspect-candidates

      - name: Acquire and verify pinned official bAbI archive
        run: python scripts/freeze_babi_tasks.py

      - name: Run structured-event oracle tests
        run: |
          python -m pytest -q \
            tests/test_babi_structured.py \
            tests/test_hlg_evidence_lifecycle.py \
            tests/test_hlg_integrated_contract_acceptance.py

      - name: Upload frozen source splits and updated manifest
        uses: actions/upload-artifact@v4
        with:
          name: babi-tasks-3-5-frozen-source
          path: |
            data/babi-v1.2/
            docs/experiments/HLG_BABI_TASKS_3_5_STRUCTURED_CAMPAIGN_v0_1.json
          if-no-files-found: error
          compression-level: 6
