name: bAbI Tasks 3 and 5 source freeze

on:
  workflow_dispatch:
  pull_request:
    branches: ["research/h0-shared-hierarchy-contract-soe-bridge", "research/h1-learning-runtime-integration"]
    paths:
      - "scripts/freeze_babi_tasks.py"
      - "docs/experiments/HLG_BABI_TASKS_3_5_STRUCTURED_CAMPAIGN_v0_1.json"
      - "src/rgm/experiments/babi_structured.py"
      - "tests/test_babi_structured.py"
      - "tests/test_babi_freeze.py"
      - "src/rgm/experiments/babi_annotation.py"
      - "scripts/annotate_babi_structured.py"
      - "tests/test_babi_annotation.py"
      - "docs/experiments/HLG_BABI_TASKS_3_5_LEARNING_PROTOCOL_v1_0.md"
      - "docs/experiments/HLG_BABI_TASKS_3_5_LEARNING_PROTOCOL_v1_2.md"
      - "src/rgm/experiments/babi_synthetic_confirmatory.py"
      - "scripts/generate_babi_confirmatory.py"
      - "tests/test_babi_synthetic_confirmatory.py"
      - "src/rgm/experiments/babi_learning_campaign.py"
      - "scripts/run_babi_learning_campaign.py"
      - "tests/test_babi_learning_campaign.py"
      - ".github/workflows/h1-babi-structured-freeze.yml"

permissions:
  contents: read

jobs:
  freeze-and-structured-smoke:
    name: Verify official bAbI archive and structured-event fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Acquire and verify pinned official bAbI archive
        run: python scripts/freeze_babi_tasks.py

      - name: Run structured-event oracle tests
        run: |
          python -m pytest -q \
            tests/test_babi_freeze.py \
            tests/test_babi_structured.py \
            tests/test_hlg_evidence_lifecycle.py \
            tests/test_hlg_integrated_contract_acceptance.py

      - name: Build source-indexed structured annotations and audit fit/validation
        run: python scripts/annotate_babi_structured.py

      - name: Generate independent confirmatory structured inputs (labels withheld)
        run: python scripts/generate_babi_confirmatory.py

      - name: Upload frozen source splits, annotations and updated manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-tasks-3-5-frozen-source
          path: |
            data/babi-v1.2/
            artifacts/babi-structured/
            artifacts/babi-confirmatory/
            docs/experiments/HLG_BABI_TASKS_3_5_STRUCTURED_CAMPAIGN_v0_1.json
            docs/experiments/HLG_BABI_TASKS_3_5_LEARNING_PROTOCOL_v1_1.md
            docs/experiments/HLG_BABI_TASKS_3_5_LEARNING_PROTOCOL_v1_2.md
          if-no-files-found: warn
          compression-level: 6


  build-native:
    name: Build pinned Aberconics C++ chain runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Aberconics framework at frozen revision
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 978117218c17fdf7cee87037bbb35789a676d174
          path: vendor/aberconics-framework

      - name: Configure shared C++ runtime
        run: |
          cmake -S "vendor/aberconics-framework/code/c++ core" \
            -B "vendor/aberconics-framework/code/c++ core/build-shared" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGFE_BUILD_TESTS=OFF \
            -DGFE_BUILD_APPS=OFF \
            -DGFE_ENABLE_SPACE_CLEAN_TARGETS=OFF

      - name: Build native runtime
        run: cmake --build "vendor/aberconics-framework/code/c++ core/build-shared" --parallel 2

      - name: Upload compiled native library
        uses: actions/upload-artifact@v4
        with:
          name: babi-gfe-core-native
          path: vendor/aberconics-framework/code/c++ core/build-shared/libgfe_core.so
          if-no-files-found: error
          compression-level: 0

  learning-campaign:
    name: Task ${{ matrix.task_id }} — ${{ matrix.architecture }}
    needs: [freeze-and-structured-smoke, build-native]
    if: needs.freeze-and-structured-smoke.result == 'success' && needs.build-native.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - task_id: 3
            architecture: HLA
          - task_id: 3
            architecture: HLB
          - task_id: 5
            architecture: HLA
          - task_id: 5
            architecture: HLB
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Checkout pinned Aberconics Python ABI
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 978117218c17fdf7cee87037bbb35789a676d174
          path: vendor/aberconics-framework

      - name: Download frozen data and annotation bundle
        uses: actions/download-artifact@v4
        with:
          name: babi-tasks-3-5-frozen-source
          path: .

      - name: Download compiled native library
        uses: actions/download-artifact@v4
        with:
          name: babi-gfe-core-native
          path: vendor/aberconics-framework/code/c++ core/build-shared

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ten-seed matched learning campaign and six ablations
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/vendor/aberconics-framework/code/python
        run: |
          python scripts/run_babi_learning_campaign.py \
            --task-id ${{ matrix.task_id }} \
            --architecture ${{ matrix.architecture }} \
            --output artifacts/babi-campaign/task${{ matrix.task_id }}-${{ matrix.architecture }}.json

      - name: Upload campaign results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babi-task${{ matrix.task_id }}-${{ matrix.architecture }}-campaign
          path: artifacts/babi-campaign/
          if-no-files-found: warn
          compression-level: 6
