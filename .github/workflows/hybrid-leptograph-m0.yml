name: Hybrid Relational Leptograph M0

on:
  push:
    branches: [research/hybrid-relational-leptograph-m0]
    paths:
      - "docs/hybrid_leptograph_foundations.md"
      - "src/rgm/leptograph/**"
      - "src/rgm/experiments/leptograph_m0.py"
      - "tests/test_leptograph_m0.py"
      - ".github/workflows/hybrid-leptograph-m0.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/hybrid_leptograph_foundations.md"
      - "src/rgm/leptograph/**"
      - "src/rgm/experiments/leptograph_m0.py"
      - "tests/test_leptograph_m0.py"
      - ".github/workflows/hybrid-leptograph-m0.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Full repository tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full repository test suite
        run: python -m pytest

  analytical-cases:
    name: Analytical reference ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case: [M0-A, M0-B, M0-C, M0-D, M0-E]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Execute analytical reference case
        run: >-
          python -m rgm.experiments.leptograph_m0
          --case ${{ matrix.case }}
          --output results/leptograph_m0/${{ matrix.case }}.json
      - name: Upload case evidence
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-leptograph-m0-${{ matrix.case }}
          path: results/leptograph_m0/${{ matrix.case }}.json
          if-no-files-found: error

  aggregate:
    name: Verify complete M0 evidence set
    runs-on: ubuntu-latest
    needs: [analytical-cases]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download all independent case artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hybrid-leptograph-m0-M0-*
          path: results/leptograph_m0
          merge-multiple: true
      - name: Require all five passing cases
        run: >-
          python -m rgm.experiments.leptograph_m0
          --verify-result-dir results/leptograph_m0
          --output results/leptograph_m0/summary.json
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-leptograph-m0-summary
          path: results/leptograph_m0/summary.json
          if-no-files-found: error
