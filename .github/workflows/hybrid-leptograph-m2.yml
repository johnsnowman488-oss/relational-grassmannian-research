name: Hybrid Relational Leptograph M2

on:
  push:
    branches: [research/hybrid-relational-leptograph-m2]
    paths:
      - "docs/hybrid_leptograph_m2_protocol.md"
      - "src/rgm/leptograph/m2.py"
      - "src/rgm/experiments/leptograph_m2.py"
      - "tests/test_leptograph_m2.py"
      - ".github/workflows/hybrid-leptograph-m2.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/hybrid_leptograph_m2_protocol.md"
      - "src/rgm/leptograph/m2.py"
      - "src/rgm/experiments/leptograph_m2.py"
      - "tests/test_leptograph_m2.py"
      - ".github/workflows/hybrid-leptograph-m2.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Full repository tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run full repository test suite
        run: python -m pytest

  route-cases:
    name: Multi-route reference ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [M2-A, M2-B, M2-C, M2-D, M2-E, M2-F]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Execute independent multi-route case
        run: >-
          python -m rgm.experiments.leptograph_m2
          --case ${{ matrix.case }}
          --output results/leptograph_m2/${{ matrix.case }}.json
      - name: Upload case evidence
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-leptograph-m2-${{ matrix.case }}
          path: results/leptograph_m2/${{ matrix.case }}.json
          if-no-files-found: error

  aggregate:
    name: Verify complete M2 evidence set
    runs-on: ubuntu-latest
    needs: [route-cases]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download all independent case artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hybrid-leptograph-m2-M2-*
          path: results/leptograph_m2
          merge-multiple: true
      - name: Require all six passing cases
        run: >-
          python -m rgm.experiments.leptograph_m2
          --verify-result-dir results/leptograph_m2
          --output results/leptograph_m2/summary.json
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-leptograph-m2-summary
          path: results/leptograph_m2/summary.json
          if-no-files-found: error
