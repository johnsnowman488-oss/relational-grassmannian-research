name: bAbI Task 11 non-oracle baseline validation

on:
  workflow_dispatch:
  push:
    branches:
      - "research/task11-campaign-gates-v1"
    paths:
      - "src/rgm/experiments/babi_expansion_adapters.py"
      - "src/rgm/experiments/babi_expansion_baselines.py"
      - "scripts/evaluate_babi_task11_baselines.py"
      - "tests/test_babi_expansion_baselines.py"
      - ".github/workflows/babi-task11-baseline-evaluation.yml"

permissions:
  contents: read

concurrency:
  group: babi-task11-baselines-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  baseline-validation:
    name: Freeze Task 11 validation split and score non-oracle baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Acquire Task 11 source member
        run: |
          python scripts/freeze_babi_expansion_sources.py \
            --tasks 11 \
            --output data/babi-v1.2-expansion
      - name: Evaluate independent non-oracle baselines on whole-story validation partition
        run: |
          python scripts/evaluate_babi_task11_baselines.py \
            --source data/babi-v1.2-expansion/qa11_basic-coreference_train.txt \
            --output artifacts/task11-baselines/task11-baseline-validation.json
      - name: Upload source audit and baseline scorecard
        uses: actions/upload-artifact@v4
        with:
          name: babi-task11-nonoracle-baseline-validation
          path: |
            data/babi-v1.2-expansion/source-audit.json
            artifacts/task11-baselines/task11-baseline-validation.json
          if-no-files-found: error
          retention-days: 365
