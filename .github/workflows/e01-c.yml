name: E01-C mechanism isolation

on:
  push:
    branches: ["e01-c-mechanism-isolation"]
    paths:
      - ".github/workflows/e01-c.yml"
      - "src/rgm/experiments/e01_c.py"
      - "src/rgm/experiments/e01_c_analysis.py"
      - "tests/test_e01_c.py"
      - "tests/test_e01_b.py"
      - "docs/e01_c_protocol.md"
  pull_request:
    branches: ["e01-b-capacity-frontier", "e01-c-mechanism-isolation"]
    paths:
      - ".github/workflows/e01-c.yml"
      - "src/rgm/experiments/e01_c.py"
      - "src/rgm/experiments/e01_c_analysis.py"
      - "tests/test_e01_c.py"
      - "tests/test_e01_b.py"
      - "docs/e01_c_protocol.md"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python \${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unit and invariant tests
        run: python -m pytest

  e01-c-diagnostics:
    name: E01-C / \${{ matrix.condition }} / \${{ matrix.memory_arm }} / w\${{ matrix.world_seed }} / cb\${{ matrix.codebook_seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        condition: [baseline_e4, repeat_e4, candidate_e16, factload_e16, depth3_e16, longgap_e16]
        memory_arm: [slow_only, full_history]
        world_seed: [501, 502, 503]
        codebook_seed: [9137, 27183, 65537]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run paired E01-C diagnostic cell
        run: |
          python -m rgm.experiments.e01_c \
            --condition \${{ matrix.condition }} \
            --memory-arm \${{ matrix.memory_arm }} \
            --world-seed \${{ matrix.world_seed }} \
            --codebook-seed \${{ matrix.codebook_seed }} \
            --output results/e01_c/ci-\${{ matrix.condition }}-\${{ matrix.memory_arm }}-w\${{ matrix.world_seed }}-cb\${{ matrix.codebook_seed }}.json
      - name: Upload per-sequence mechanism evidence
        uses: actions/upload-artifact@v4
        with:
          name: e01-c-\${{ matrix.condition }}-\${{ matrix.memory_arm }}-w\${{ matrix.world_seed }}-cb\${{ matrix.codebook_seed }}
          path: results/e01_c/ci-\${{ matrix.condition }}-\${{ matrix.memory_arm }}-w\${{ matrix.world_seed }}-cb\${{ matrix.codebook_seed }}.json
          if-no-files-found: error

  e01-c-summary:
    name: E01-C paired mechanism summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e01-c-diagnostics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download paired diagnostic cells
        uses: actions/download-artifact@v4
        with:
          pattern: e01-c-*
          path: results/e01_c
          merge-multiple: true
      - name: Compute paired intervention and path summaries
        run: |
          python -m rgm.experiments.e01_c_analysis \
            --input-dir results/e01_c \
            --output results/e01_c/paired_summary.json
      - name: Upload E01-C paired summary
        uses: actions/upload-artifact@v4
        with:
          name: e01-c-paired-summary
          path: results/e01_c/paired_summary.json
          if-no-files-found: error
