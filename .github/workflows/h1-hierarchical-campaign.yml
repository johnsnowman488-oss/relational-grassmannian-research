name: H1 matched hierarchical campaigns

on:
  pull_request:
    branches: ["research/h0-shared-hierarchy-contract-soe-bridge"]
    paths:
      - "src/rgm/leptograph/m4/**"
      - "src/rgm/experiments/h1_hierarchical_campaign.py"
      - "scripts/run_h1_hierarchical_campaign.py"
      - "docs/experiments/HLG_H1_HIERARCHICAL_PARTITIONS_v1.*"
      - "tests/test_hlg_h1_campaign_protocol.py"
      - ".github/workflows/h1-hierarchical-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-campaign:
    name: Build native runtime and run independent H1 validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          path: research

      - name: Checkout pinned Aberconics M4 runtime
        uses: actions/checkout@v4
        with:
          repository: johnsnowman488-oss/aberconics-framework
          ref: 2539df6bda7ef3c9dd7c707abe26eff8bdbb59de
          path: aberconics

      - name: Verify pinned native source
        id: source
        working-directory: aberconics
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "2539df6bda7ef3c9dd7c707abe26eff8bdbb59de"
          echo "commit=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Configure and build M4 shared library
        run: |
          cmake -S "aberconics/code/c++ core" -B "aberconics/code/c++ core/build-shared" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGFE_BUILD_TESTS=OFF -DGFE_BUILD_APPS=OFF
          cmake --build "aberconics/code/c++ core/build-shared" --parallel 2

      - name: Verify compiled library
        id: library
        run: |
          LIB="$GITHUB_WORKSPACE/aberconics/code/c++ core/build-shared/libgfe_core.so"
          test -s "$LIB"
          echo "path=$LIB" >> "$GITHUB_OUTPUT"
          sha256sum "$LIB"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "research[dev]"

      - name: Run H1 validation partition only
        env:
          GFE_CORE_LIB: ${{ steps.library.outputs.path }}
          ABERCONICS_PYTHON: ${{ github.workspace }}/aberconics/code/python
          ABERCONICS_COMMIT: ${{ steps.source.outputs.commit }}
          PYTHONPATH: ${{ github.workspace }}/research/src:${{ github.workspace }}/aberconics/code/python
        run: |
          python research/scripts/run_h1_hierarchical_campaign.py \
            --partition validation \
            --output artifacts/h1-hierarchical-validation.json

      - name: Upload H1 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-hierarchical-validation
          path: artifacts/h1-hierarchical-validation.json
          if-no-files-found: warn
